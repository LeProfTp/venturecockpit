<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venture Cockpit · ECL</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   TOKENS & RESET
═══════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0F0D15;--sb:#13111C;--card:#1A1728;--card-hi:#221F30;
  --border:rgba(180,160,220,.1);--border-md:rgba(180,160,220,.18);
  --text:#FFFFFF;--dim:#7868A8;--muted:#1E1B2A;
  --gold:#C87C38;--teal:#2A7E7E;--green:#2E7A52;--rose:#B85070;
  --violet:#6858B8;--orange:#BC5C36;
  --r:13px;--r-sm:9px;--r-xs:6px;
  --sb-w:224px;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;
  font-size:14px;line-height:1.65;min-height:100vh;overflow-x:hidden}

/* ═══════════════════════════════════════════
   LAYOUT: SIDEBAR + CONTENT
═══════════════════════════════════════════ */
#app{display:flex;min-height:100vh}
#sidebar{
  width:var(--sb-w);flex-shrink:0;background:var(--sb);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:fixed;top:0;left:0;
  height:100vh;overflow-y:auto;overflow-x:hidden;z-index:50;
  scrollbar-width:thin;scrollbar-color:var(--muted) transparent
}
#content{margin-left:var(--sb-w);flex:1;min-height:100vh}
.content-inner{max-width:920px;margin:0 auto;padding:28px 24px 64px}

/* ═══════════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════════ */
.sb-venture{padding:18px 16px 12px;border-bottom:1px solid var(--border)}
.sb-label{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);font-family:'Syne',sans-serif;font-weight:700;margin-bottom:4px}
.sb-name{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;
  color:var(--text);line-height:1.2;word-break:break-word}
.sb-name-input{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;
  color:var(--text);line-height:1.2;background:transparent;border:none;border-bottom:1px dashed rgba(180,160,220,.25);
  width:100%;padding:0 0 2px;outline:none}
.sb-name-input:focus{border-bottom-color:var(--gold)}
.sb-tag{font-size:11px;color:var(--dim);margin-top:2px}
.sb-progress{margin-top:10px}
.sb-prog-row{display:flex;justify-content:space-between;font-size:9.5px;
  color:var(--dim);font-family:'Syne',sans-serif;margin-bottom:4px}
.sb-prog-track{height:3px;background:var(--muted);border-radius:2px;overflow:hidden}
.sb-prog-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--violet));
  border-radius:2px;transition:width .5s}

.sb-section{padding:10px 0}
.sb-section-label{color:#8A80C0;color:#5A5280;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);font-family:'Syne',sans-serif;font-weight:700;
  padding:4px 16px 6px}
.sb-item{display:flex;align-items:center;gap:9px;padding:7px 16px;
  cursor:pointer;transition:all .15s;text-decoration:none;border-left:2px solid transparent;
  font-size:13px;color:var(--dim);font-family:'Syne',sans-serif;font-weight:600}
.sb-item:hover{background:rgba(255,255,255,.035);color:var(--text);border-left-color:var(--muted)}
.sb-item.active{background:rgba(200,124,56,.07);color:var(--gold);border-left-color:var(--gold)}
.sb-item .sb-icon{font-size:14px;width:20px;text-align:center;flex-shrink:0}
.sb-item .sb-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-left:auto}
.sb-divider{height:1px;background:var(--border);margin:6px 16px}
.sb-import-btn{margin:12px 14px;padding:8px;background:color-mix(in srgb,var(--gold) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--gold) 28%,transparent);border-radius:var(--r-sm);
  color:var(--gold);font-family:'Syne',sans-serif;font-weight:700;font-size:11px;
  letter-spacing:.05em;text-align:center;cursor:pointer;transition:all .18s;text-transform:uppercase}
.sb-import-btn:hover{background:color-mix(in srgb,var(--gold) 18%,transparent)}
.sb-reset-btn{margin:6px 14px 12px;padding:7px;background:transparent;
  border:1px solid rgba(224,112,112,.2);border-radius:var(--r-sm);
  color:#E07070;font-family:'Syne',sans-serif;font-weight:700;font-size:10.5px;
  text-align:center;cursor:pointer;transition:background .15s,border-color .15s}
.sb-reset-btn:hover{background:rgba(224,112,112,.1);border-color:rgba(224,112,112,.4)}

/* ═══════════════════════════════════════════
   PAGE HEADER
═══════════════════════════════════════════ */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;
  gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-title{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;color:var(--text)}
.page-sub{font-size:13px;color:var(--dim);margin-top:3px}
.breadcrumb{font-size:10px;color:var(--dim);font-family:'Syne',sans-serif;
  font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}

/* ═══════════════════════════════════════════
   CARDS
═══════════════════════════════════════════ */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 1px 6px rgba(0,0,0,.35);overflow:hidden}
.card-header{display:flex;align-items:center;gap:10px;padding:14px 18px;
  border-bottom:1px solid var(--border)}
.card-icon{font-size:17px;width:22px;text-align:center;flex-shrink:0}
.card-title{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;color:var(--text);flex:1}
.card-action{font-size:11px;color:var(--dim);cursor:pointer;font-family:'Syne',sans-serif;
  font-weight:600;transition:color .15s;white-space:nowrap;flex-shrink:0}
.card-action:hover{color:var(--gold)}
.card-body{padding:16px 18px}

/* ═══════════════════════════════════════════
   STATUS SYSTEM
═══════════════════════════════════════════ */
.status-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;
  border-radius:20px;font-family:'Syne',sans-serif;font-weight:700;
  font-size:9.5px;letter-spacing:.06em;text-transform:uppercase}
.status-locked{background:rgba(112,104,160,.12);color:var(--dim);border:1px solid rgba(112,104,160,.18)}
.status-draft{background:rgba(112,104,160,.16);color:#7A98B8;border:1px solid rgba(112,104,160,.25)}
.status-imported{background:rgba(200,124,56,.1);color:var(--gold);border:1px solid rgba(200,124,56,.22)}
.status-revised{background:rgba(129,140,248,.1);color:var(--violet);border:1px solid rgba(129,140,248,.22)}
.status-validated{background:rgba(52,211,153,.1);color:var(--green);border:1px solid rgba(52,211,153,.22)}
.status-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.status-active .status-dot{animation:pulse 1.8s ease-in-out infinite}

/* ═══════════════════════════════════════════
   DASHBOARD: TIMELINE
═══════════════════════════════════════════ */
.timeline{display:flex;align-items:flex-start;gap:0;overflow-x:auto;
  padding:16px 18px;scrollbar-width:none}
.timeline::-webkit-scrollbar{display:none}
.tl-item{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:86px;position:relative;flex:1}
.tl-item:not(:last-child)::after{content:'';position:absolute;
  top:13px;left:calc(50% + 12px);right:calc(-50% + 12px);
  height:1px;background:var(--border-md)}
.tl-circle{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:10px;font-weight:700;position:relative;z-index:1;
  border:2px solid;transition:all .2s;cursor:default;flex-shrink:0}
.tl-circle.tl-done{background:rgba(52,211,153,.12);border-color:var(--green);color:var(--green)}
.tl-circle.tl-active{background:rgba(200,124,56,.12);border-color:var(--gold);color:var(--gold)}
.tl-circle.tl-imported{background:rgba(42,126,126,.12);border-color:var(--teal);color:var(--teal)}
.tl-circle.tl-odoo{background:rgba(129,140,248,.12);border-color:var(--violet);color:var(--violet)}
.tl-circle.tl-locked{background:rgba(255,255,255,.04);border-color:rgba(180,160,220,.2);color:rgba(180,160,220,.35)}
.tl-label{font-size:9.5px;text-align:center;color:#C8C0E8;line-height:1.35;font-family:'Syne',sans-serif;font-weight:600;max-width:80px;overflow-wrap:break-word;hyphens:auto}

/* ═══════════════════════════════════════════
   DASHBOARD GRID
═══════════════════════════════════════════ */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.dash-grid.wide{grid-template-columns:1fr}
.dash-grid.thirds{grid-template-columns:1fr 1fr 1fr}

/* Module grid on dashboard */
.module-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.mod-card{background:var(--card-hi);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:12px 11px;cursor:pointer;
  transition:all .18s;text-decoration:none;display:flex;flex-direction:column;gap:6px}
.mod-card:hover{border-color:var(--mc);background:color-mix(in srgb,var(--mc) 8%,transparent)}
.mod-card .mc-icon{font-size:18px}
.mod-card .mc-name{font-family:'Syne',sans-serif;font-weight:700;font-size:11.5px;
  color:var(--text);line-height:1.25}
.mod-card .mc-session{font-size:9px;color:var(--dim);font-family:'DM Mono',monospace}
.mod-card .mc-prog{margin-top:4px;height:2px;background:var(--muted);border-radius:1px;overflow:hidden}
.mod-card .mc-prog-fill{height:100%;background:var(--mc);border-radius:1px;transition:width .4s}

/* Stats */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px}
.stat-v{font-family:'Syne',sans-serif;font-weight:800;font-size:21px;line-height:1}
.stat-l{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--dim);font-family:'Syne',sans-serif;margin-top:3px}

/* ═══════════════════════════════════════════
   FEEDBACK LOG
═══════════════════════════════════════════ */
.fb-item{display:flex;align-items:flex-start;gap:11px;padding:10px 0;
  border-bottom:1px solid var(--border)}
.fb-item:last-child{border-bottom:none;padding-bottom:0}
.fb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.fb-session{font-family:'DM Mono',monospace;font-size:10px;color:var(--gold);flex-shrink:0;margin-top:2px}
.fb-text{font-size:12.5px;color:var(--dim);line-height:1.55;flex:1}
.fb-text strong{color:var(--text)}
.fb-status{font-family:'Syne',sans-serif;font-weight:700;font-size:9px;
  padding:2px 7px;border-radius:20px;flex-shrink:0;margin-top:2px}

/* ═══════════════════════════════════════════
   ASSUMPTIONS
═══════════════════════════════════════════ */
.assumption-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--border)}
.assumption-item:last-child{border-bottom:none;padding-bottom:0}
.asm-status{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:10px;flex-shrink:0;border:1.5px solid}
.asm-text{font-size:13px;color:var(--text);flex:1;line-height:1.5}
.asm-cat{font-size:9.5px;color:var(--dim);font-family:'DM Mono',monospace}
.asm-add{display:flex;gap:8px;margin-top:10px}

/* ═══════════════════════════════════════════
   MODULE VIEW
═══════════════════════════════════════════ */
.mod-banner{border-radius:var(--r);padding:18px 22px;margin-bottom:18px;
  border:1px solid;display:flex;align-items:center;gap:16px}
.mod-banner-icon{font-size:32px}
.mod-banner-title{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;color:var(--text)}
.mod-banner-sub{font-size:12px;color:var(--dim);margin-top:2px}
.mod-layout{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.mod-fields-section{display:flex;flex-direction:column;gap:12px}
.mod-right{display:flex;flex-direction:column;gap:14px}

/* Field group */
.field-group{display:flex;flex-direction:column;gap:5px}
.field-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;
  font-family:'Syne',sans-serif;font-weight:700;color:var(--mc)}
.field-hint{font-size:11px;color:var(--dim);font-style:italic}
.field-input,.field-textarea{width:100%;background:rgba(25,20,50,.06);
  border:1px solid var(--border-md);border-radius:var(--r-xs);
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:13.5px;
  padding:8px 11px;outline:none;transition:border-color .18s;resize:vertical}
.field-textarea{min-height:64px;line-height:1.6}
.field-input:focus,.field-textarea:focus{border-color:var(--mc)}
.field-char{font-size:9.5px;color:var(--muted);text-align:right;margin-top:1px}
.field-char.ok{color:var(--green)}

/* Feedback card */
.feedback-card{background:color-mix(in srgb,var(--gold) 5%,transparent);
  border:1px solid color-mix(in srgb,var(--gold) 20%,transparent);border-radius:var(--r)}
.feedback-head{padding:12px 14px;border-bottom:1px solid color-mix(in srgb,var(--gold) 15%,transparent);
  display:flex;align-items:center;gap:8px}
.feedback-star{font-size:14px}
.feedback-title{font-family:'Syne',sans-serif;font-weight:700;font-size:12.5px;color:var(--gold)}
.feedback-body{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.feedback-sublabel{font-size:9px;text-transform:uppercase;letter-spacing:.12em;
  color:var(--gold);font-family:'Syne',sans-serif;font-weight:700;margin-bottom:3px}
.feedback-note{font-size:12px;color:var(--dim);font-style:italic;line-height:1.5;
  background:rgba(25,20,50,.04);border-radius:var(--r-xs);padding:7px 10px}

/* Status selector */
.status-selector{display:flex;flex-direction:column;gap:6px}
.status-opt{display:flex;align-items:center;gap:9px;padding:8px 12px;
  border-radius:var(--r-sm);cursor:pointer;border:1px solid var(--border);
  transition:all .18s;font-size:12.5px;color:var(--dim)}
.status-opt:hover{background:rgba(255,255,255,.03)}
.status-opt.selected{border-color:var(--sc);background:color-mix(in srgb,var(--sc) 8%,transparent);color:var(--sc)}
.status-opt .so-dot{width:8px;height:8px;border-radius:50%;background:var(--sc);flex-shrink:0}
.status-opt .so-label{font-family:'Syne',sans-serif;font-weight:700;font-size:11px}
.status-opt .so-desc{font-size:10.5px;color:var(--dim)}

/* Import source badge */
.import-source{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--dim);
  font-family:'DM Mono',monospace;padding:6px 10px;
  background:rgba(42,126,126,.05);border:1px solid rgba(42,126,126,.12);
  border-radius:var(--r-xs);flex-wrap:wrap}
.import-source strong{color:var(--teal)}

/* ═══════════════════════════════════════════
   OUTPUTS
═══════════════════════════════════════════ */
.output-section{margin-bottom:22px}
.output-section-title{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;
  color:var(--text);margin-bottom:10px;padding-bottom:8px;
  border-bottom:1px solid var(--border)}
.output-block{background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:14px 18px;margin-bottom:8px}
.output-label{font-size:9px;text-transform:uppercase;letter-spacing:.12em;
  color:var(--mc,var(--teal));font-family:'Syne',sans-serif;font-weight:700;margin-bottom:6px}
.output-text{font-size:13.5px;color:var(--text);line-height:1.7;white-space:pre-wrap}
.output-empty{font-size:12.5px;color:var(--muted);font-style:italic}

/* ═══════════════════════════════════════════
   IMPORT MODAL
═══════════════════════════════════════════ */
.modal-overlay{display:none;position:fixed;inset:0;z-index:200;
  background:rgba(2,6,16,.85);backdrop-filter:blur(8px);
  align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border-md);
  border-radius:var(--r);max-width:520px;width:90%;max-height:85vh;
  overflow-y:auto;display:flex;flex-direction:column}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;color:var(--text)}
.modal-close{font-size:18px;color:var(--dim);cursor:pointer;transition:color .15s}
.modal-close:hover{color:var(--text)}
.modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:14px;flex:1}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);
  display:flex;gap:9px;justify-content:flex-end}
.drop-zone{border:2px dashed var(--muted);border-radius:var(--r);
  padding:38px 20px;text-align:center;cursor:pointer;transition:all .22s;
  background:rgba(0,0,0,.15)}
.drop-zone:hover,.drop-zone.drag{border-color:var(--gold);background:rgba(200,124,56,.04)}
.drop-icon{font-size:36px;margin-bottom:10px}
.drop-title{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;color:var(--text);margin-bottom:4px}
.drop-sub{font-size:12.5px;color:var(--dim)}
.import-preview{background:rgba(52,211,153,.05);border:1px solid rgba(52,211,153,.18);
  border-radius:var(--r-sm);padding:13px 15px}
.import-preview-title{font-family:'Syne',sans-serif;font-weight:700;font-size:11.5px;
  color:var(--green);margin-bottom:9px}
.import-preview-item{font-size:11.5px;color:var(--dim);padding:3px 0;
  display:flex;gap:8px;align-items:baseline}
.import-preview-item strong{color:var(--text);font-size:12.5px;max-width:220px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.import-preview-key{font-family:'DM Mono',monospace;font-size:10px;color:var(--teal);flex-shrink:0}

/* ═══════════════════════════════════════════
   BUTTONS
═══════════════════════════════════════════ */
.btn{padding:8px 16px;border-radius:var(--r-xs);border:none;cursor:pointer;
  font-family:'Syne',sans-serif;font-weight:700;font-size:12px;letter-spacing:.04em;
  transition:all .18s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-gold{background:linear-gradient(135deg,var(--gold),#C97800);color:#111}
.btn-gold:hover{opacity:.9;transform:translateY(-1px)}
.btn-teal{background:linear-gradient(135deg,var(--teal),#089B9B);color:#111}
.btn-teal:hover{opacity:.9}
.btn-ghost{background:transparent;border:1px solid var(--muted);color:var(--dim)}
.btn-ghost:hover{border-color:var(--dim);color:var(--text)}
.btn-danger{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.25);color:var(--rose)}
.btn-sm{padding:5px 11px;font-size:10.5px}
.btn-icon{width:32px;height:32px;padding:0;justify-content:center;font-size:15px}

/* ═══════════════════════════════════════════
   MISC
═══════════════════════════════════════════ */
.empty-state{text-align:center;padding:32px 20px;color:var(--muted)}
.empty-icon{font-size:36px;margin-bottom:10px;opacity:.5}
.empty-text{font-size:13px}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;
  font-family:'DM Mono',monospace;border:1px solid;white-space:nowrap}
.section-divider{height:1px;background:var(--border);margin:18px 0}
.mono{font-family:'DM Mono',monospace}
textarea,input{background:none;color:var(--text);font-family:inherit}

/* Toast */
#toasts{position:fixed;bottom:20px;right:18px;z-index:999;
  display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toast{background:rgba(26,23,40,.96);backdrop-filter:blur(16px);
  border:1px solid var(--border-md);border-left-width:3px;
  padding:9px 14px;border-radius:var(--r-xs);font-size:12.5px;
  color:var(--text);max-width:280px;
  animation:tIn .24s ease,tOut .24s ease 2.6s forwards;pointer-events:none}
@keyframes tIn{from{transform:translateX(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes tOut{to{transform:translateX(14px);opacity:0}}

/* Responsive */
@media(max-width:800px){
  #sidebar{transform:translateX(-100%);transition:transform .25s}
  #sidebar.open{transform:none}
  #content{margin-left:0}
  .mod-layout{grid-template-columns:1fr}
  .module-grid{grid-template-columns:repeat(2,1fr)}

/* ── AUTOSAVE INDICATOR ──────────────────────────── */
#autosave-ind{

/* ── MENTOR MODE ─────────────────────────────────────── */
#mentor-app{display:none;min-height:100vh;background:#F4F1EB;color:#3A3460;font-family:'DM Sans',sans-serif}
.mentor-header{background:rgba(244,241,235,.95);border-bottom:1px solid rgba(255,255,255,.07);
  padding:14px 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100}
.mentor-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:11px;
  letter-spacing:.16em;color:#2A7E7E;text-transform:uppercase}
.mentor-badge{background:rgba(200,124,56,.14);border:1px solid rgba(200,124,56,.3);
  color:#C87C38;font-family:'Syne',sans-serif;font-weight:700;font-size:9px;
  padding:3px 9px;border-radius:20px;letter-spacing:.1em;text-transform:uppercase}
.mentor-wrap{max-width:1100px;margin:0 auto;padding:32px 24px 80px}

.mentor-gate h2{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;color:#E8E4F0;margin-bottom:6px}
.mentor-gate p{font-size:13px;color:#8878B8;margin-bottom:22px}
.mentor-gate input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(180,160,220,.2);
  border-radius:5px;color:#E8E4F0;font-size:14px;padding:10px 13px;outline:none;
  margin-bottom:10px;transition:border-color .18s}
.mentor-gate input:focus{border-color:#C87C38}
.mentor-gate-err{font-size:11.5px;color:#F87171;min-height:18px;margin-top:3px}
.mentor-grid{display:flex;flex-direction:column;gap:16px}
.v-card{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:12px;overflow:hidden}
.v-card-head{display:grid;grid-template-columns:220px 1fr;align-items:start;gap:0}
.v-name-col{padding:18px 20px;border-right:1px solid rgba(255,255,255,.07)}
.v-name{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:#fff;margin-bottom:4px}
.v-idea{font-size:12px;color:#5A5280;line-height:1.55}
.v-sessions-col{padding:14px 20px;display:flex;flex-direction:column;gap:10px}
.v-session{display:grid;grid-template-columns:60px 80px 1fr;gap:12px;align-items:start;
  padding:10px 12px;background:rgba(25,20,50,.04);border-radius:8px;border:1px solid rgba(255,255,255,.05)}
.v-s-label{font-family:'Syne',sans-serif;font-weight:800;font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;color:#5A5280;margin-top:1px}
.v-stars{display:flex;gap:2px;font-size:14px;margin-top:4px}
.star-on{color:#C87C38}
.star-off{color:#1E2D3F}
.v-bullets{display:flex;flex-direction:column;gap:4px}
.v-bullet{font-size:11.5px;line-height:1.45;display:flex;gap:6px;align-items:baseline}
.v-bullet::before{font-size:9px;flex-shrink:0;margin-top:1px}
.v-bullet.pos::before{content:'●';color:#34D399}
.v-bullet.gap::before{content:'●';color:#F87171}
.v-bridge{margin:2px 0 2px 0;padding:7px 12px;
  background:rgba(42,126,126,.05);border-left:2px solid rgba(42,126,126,.25);
  border-radius:0 5px 5px 0;font-size:11px;color:#5A5280}
.v-bridge strong{color:#2A7E7E;font-family:'Syne',sans-serif;font-weight:700;font-size:9px;
  text-transform:uppercase;letter-spacing:.1em;display:block;margin-bottom:3px}
.v-bridge-item{display:flex;gap:5px;align-items:baseline;font-size:11px}
.v-bridge-item.closed::before{content:'✓';color:#34D399;font-size:10px;flex-shrink:0}
.v-bridge-item.open::before{content:'△';color:#C87C38;font-size:10px;flex-shrink:0}
.mentor-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px}
.mentor-page-title{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;color:#fff}
.mentor-sub{font-size:12.5px;color:#5A5280;margin-top:2px}
.mentor-legend{display:flex;gap:16px;font-size:10.5px;color:#5A5280;align-items:center;flex-wrap:wrap}

/* ── ANALYSE VIEWS ──────────────────────────────────────────── */
.view-title{font-family:'Syne',sans-serif;font-weight:800;font-size:24px;color:#FFFFFF;margin-bottom:6px}
.view-sub{font-size:13px;color:#5A5280;margin-bottom:28px;line-height:1.5}
.view-section{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:22px 24px;margin-bottom:14px}
.view-section-title{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#5A5280;margin-bottom:16px}

.map-node:hover circle{filter:brightness(1.3)}
.map-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:#5A5280;margin-top:10px}
.map-legend-item{display:flex;align-items:center;gap:5px}
.map-legend-dot{width:8px;height:8px;border-radius:50%}

/* Consistency Check */

.cc-pair.cc-ok{border-color:rgba(52,211,153,.3)}
.cc-pair.cc-warn{border-color:rgba(200,124,56,.3)}
.cc-pair.cc-bad{border-color:rgba(248,113,113,.3)}
.cc-pair-head{display:flex;align-items:center;gap:12px;padding:14px 18px;background:rgba(25,20,50,.04)}
.cc-bridge{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;color:#FFFFFF;flex:1}
.cc-bridge-sub{font-size:11px;color:#5A5280;margin-top:2px}
.cc-status-btns{display:flex;gap:6px;flex-shrink:0}
.cc-btn{padding:3px 10px;border-radius:20px;font-size:10px;font-family:'Syne',sans-serif;font-weight:700;cursor:pointer;border:1px solid rgba(255,255,255,.1);color:#5A5280;background:none;transition:all .15s}
.cc-btn.ok{border-color:rgba(52,211,153,.5);color:#34D399;background:rgba(52,211,153,.1)}
.cc-btn.warn{border-color:rgba(200,124,56,.5);color:#C87C38;background:rgba(200,124,56,.1)}
.cc-btn.bad{border-color:rgba(248,113,113,.5);color:#F87171;background:rgba(248,113,113,.1)}
.cc-body{padding:14px 18px}
.cc-question{font-size:12.5px;color:#5A5280;font-style:italic;margin-bottom:8px}
.cc-summary{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.cc-summary-chip{padding:6px 14px;border-radius:20px;font-family:'Syne',sans-serif;font-weight:700;font-size:11px}

/* Reality Check */
.reality-grid{display:flex;flex-direction:column;gap:14px}
.reality-item{background:rgba(248,113,113,.04);border:1px solid rgba(248,113,113,.15);border-radius:10px;padding:16px 18px}
.reality-label{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.reality-icon{font-size:22px}
.reality-title{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;color:#FFFFFF}
.reality-hint{font-size:11.5px;color:#5A5280;font-style:italic;margin-bottom:8px}

/* Maturity Radar */
.maturity-wrap{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.maturity-radar{flex:0 0 300px}
.maturity-radar svg{width:300px;height:300px}
.maturity-dims{flex:1;min-width:200px;display:flex;flex-direction:column;gap:10px}
.maturity-dim{display:flex;flex-direction:column;gap:4px}
.maturity-dim-head{display:flex;align-items:center;justify-content:space-between}
.maturity-dim-label{font-size:12px;font-family:'Syne',sans-serif;font-weight:700;color:#FFFFFF}
.maturity-dim-score{font-size:11px;font-family:'Syne',sans-serif;font-weight:700}
.maturity-bar-track{height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.maturity-bar-fill{height:100%;border-radius:3px;transition:width .5s}
.maturity-score-total{font-family:'Syne',sans-serif;font-weight:800;font-size:44px;line-height:1;color:#2A7E7E;text-align:center;margin-top:8px}
.maturity-score-label{font-size:11px;color:#5A5280;text-align:center;font-family:'Syne',sans-serif}

/* Pitch Mode */
.pitch-mode-wrap{background:#13111C;border:1px solid rgba(180,160,220,.1);border-radius:12px;overflow:hidden;min-height:500px}
.pitch-slide{display:none;min-height:480px;padding:52px 56px;flex-direction:column;justify-content:center}
.pitch-slide.active{display:flex}
.pitch-slide-num{font-family:'Syne',sans-serif;font-weight:700;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.pitch-slide-title{font-family:'Syne',sans-serif;font-weight:800;font-size:32px;color:#FFFFFF;margin-bottom:22px;line-height:1.15}
.pitch-slide-body{font-size:15px;color:var(--text);line-height:1.75;flex:1;white-space:pre-wrap}
.pitch-slide-empty{font-size:13px;color:var(--dim);font-style:italic}
.pitch-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:rgba(25,20,50,.06);border-top:1px solid rgba(255,255,255,.05)}
.pitch-nav-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#5A5280;padding:7px 16px;border-radius:6px;cursor:pointer;font-family:'Syne',sans-serif;font-weight:700;font-size:11px;transition:all .18s}
.pitch-nav-btn:hover:not(:disabled){background:rgba(255,255,255,.1);color:#FFFFFF}
.pitch-nav-btn:disabled{opacity:.3;cursor:default}
.pitch-dots{display:flex;gap:6px;align-items:center}
.pitch-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15);cursor:pointer;transition:all .18s}
.pitch-dot.active{background:#2A7E7E;width:18px;border-radius:3px}

/* Feedback Evolution */
.evo-list{display:flex;flex-direction:column;gap:16px}
.evo-card{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:10px;overflow:hidden}
.evo-card-head{padding:12px 18px;background:rgba(25,20,50,.04);display:flex;align-items:center;gap:10px;cursor:pointer}
.evo-card-icon{font-size:18px}
.evo-card-title{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;color:#FFFFFF;flex:1}
.evo-card-status{font-size:10px;padding:3px 8px;border-radius:20px;font-family:'Syne',sans-serif;font-weight:700}
.evo-steps{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:0}
.evo-step{padding:14px 16px;border-right:1px solid rgba(255,255,255,.05)}
.evo-step:last-child{border-right:none}
.evo-step-label{font-size:9px;text-transform:uppercase;letter-spacing:.12em;font-family:'Syne',sans-serif;font-weight:700;margin-bottom:6px}
.evo-step-text{font-size:12px;color:#8DA5B8;line-height:1.55;white-space:pre-wrap}
.evo-step-empty{font-size:11px;color:var(--dim);font-style:italic}

/* Assumptions enhanced */
.assump-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.assump-card{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:16px;position:relative}
.assump-card.risk-high{border-color:rgba(248,113,113,.25)}
.assump-card.risk-med{border-color:rgba(200,124,56,.2)}
.assump-card.risk-low{border-color:rgba(52,211,153,.15)}
.assump-text{font-size:13px;color:#FFFFFF;margin-bottom:10px;line-height:1.5}
.assump-meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.assump-chip{font-size:9.5px;font-family:'Syne',sans-serif;font-weight:700;padding:3px 8px;border-radius:20px}
.assump-next{font-size:11px;color:#5A5280;font-style:italic;line-height:1.45}
.add-assump-form{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:18px;margin-top:14px}

.gl-steps{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}

.gl-step-num{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;
  color:#2A7E7E;opacity:.4;line-height:1;flex-shrink:0;min-width:24px}
.gl-step-title{font-family:'Syne',sans-serif;font-weight:700;font-size:13.5px;
  color:#FFFFFF;margin-bottom:3px}
.gl-step-
.gl-step-body code{background:rgba(42,126,126,.1);color:#2A7E7E;padding:1px 6px;

.gl-tool-icon{font-size:18px;margin-bottom:6px}
.gl-tool-name{font-family:'Syne',sans-serif;font-weight:700;font-size:12.5px;color:#FFFFFF;margin-bottom:3px}
.gl-tool-desc{font-size:11.5px;color:#9890B4;line-height:1.5}
.gl-tips{background:var(--card);border:1px solid rgba(25,20,50,.08);border-radius:10px;

.gl-tip{display:flex;gap:10px;align-items:baseline;padding:5px 0;
  border-bottom:1px solid rgba(200,180,255,.05)}
.gl-tip:last-child{border-bottom:none}
.gl-tip-q{font-size:12px;color:#FFFFFF;flex:1}
.gl-tip-a{font-size:12px;color:#9890B4;flex:1.2}

.gl-sess-label{font-size:9.5px;color:#5A5280;margin-top:3px;line-height:1.35}
.gl-sess.importable .gl-sess-num{opacity:.9;color:#C87C38}
.gl-sess.importable .gl-sess-label{color:#A098C0}

  border:1px solid rgba(200,124,56,.3);border-radius:20px;font-family:'Syne',sans-serif;

.gl-footer{margin-top:36px;padding-top:16px;border-top:1px solid rgba(200,180,255,.07);
  font-size:10.5px;color:#E0DACC;text-align:center}
@media(max-width:560px){.gl-tools{grid-template-columns:1fr}.gl-sessions{grid-template-columns:repeat(2,1fr)}}

  .gl-step-num,.gl-sess-num{color:#110E18}.gl-step-title,.gl-tool-name{color:#110E18}

function detectAndMap(data) {
  // S2 old format (_type: ecl-s2-submission)
  if (data._type === 'ecl-s2-submission') return mapS2Old(data);
  // S2 feedback old format
  if (data._type === 'ecl-s2-feedback') return { _isFeedback: true, _session: 2, data };
  // S4 feedback
  if (data._type === 'ecl-s4-feedback') return { _isFeedback: true, _session: 4, data };
  // S4 format
  if (data.contextCanvas || data.businessModel || data.prozess) return mapS4(data);
  // S5 format
  if (data._type === 'ecl-s5-submission') return mapS5(data);
  // S7 format
  if (data._type === 'ecl-s7-submission') return mapS7(data);
  // S5/S7 feedback
  if (data._type === 'ecl-s5-feedback') return { _isFeedback: true, _session: 5, data };
  if (data._type === 'ecl-s7-feedback') return { _isFeedback: true, _session: 7, data };
  // S2 new format (arbeitsauftraege)
  if (data.arbeitsauftraege) return mapS2New(data);
  return null;
}

function mapS5(d) {
  const fields = {};
  const f = d.fields || {};
  if (f.wa3_functional) fields['kunden.painPoints'] = f.wa3_functional;
  if (f.wa3_social) fields['kunden.motivation'] = f.wa3_social;
  if (f.wa3_blind) fields['kunden.workarounds'] = f.wa3_blind;
  if (f.wa0_assumptions) fields['kennzahlen.hypotheses'] = f.wa0_assumptions;
  if (f.wa4_hypothesis) fields['kennzahlen.experiments'] = f.wa4_hypothesis;
  if (f.wa5_decision) fields['kennzahlen.kpis'] = f.wa5_decision;
  if (f.wa6_strongest) fields['kunden.keyInsights'] = f.wa6_strongest;
  if (f.wa6_fragile) fields['kunden.validationStatus'] = f.wa6_fragile;
  if (f.wa7_top3) fields['kennzahlen.learnings'] = f.wa7_top3;
  if (f.wa7_pivot) fields['kennzahlen.nextSteps'] = f.wa7_pivot;
  // Map evidence log to customer profiles
  if (d.evidenceLog && d.evidenceLog.length) {
    const evText = d.evidenceLog.map((e,i)=>'Gespräch '+(i+1)+' ('+(e.partner||'?')+'): '+(e.insight||e.reaction||'')).join('\n');
    fields['kunden.customerProfiles'] = evText;
  }
  if (d.kpis && d.kpis.length) {
    fields['kennzahlen.kpis'] = d.kpis.map(k=>k.name+(k.target?' → '+k.target:'')).join('\n');
  }
  return Object.keys(fields).length ? fields : null;
}

function mapS7(d) {
  const fields = {};
  const f = d.fields || {};
  if (f.wa0_current) fields['wachstum.channels'] = f.wa0_current;
  if (f.wa1_scale10x) fields['wachstum.scalingLogic'] = f.wa1_scale10x;
  if (f.wa4_manual) fields['operations.odooConnection'] = f.wa4_manual;
  if (f.wa4_bottleneck) fields['operations.step4'] = f.wa4_bottleneck;
  if (f.wa5_risks) fields['ethik.risks'] = f.wa5_risks;
  if (f.wa6_engine_why) fields['wachstum.marketingStrategy'] = f.wa6_engine_why;
  if (f.wa6_assumptions) fields['kennzahlen.hypotheses'] = f.wa6_assumptions;
  if (f.wa6_cockpit) fields['wachstum.growthPath'] = f.wa6_cockpit;
  if (f.wa7_system) fields['wachstum.scalingLogic'] = f.wa7_system;
  if (f.wa7_break) fields['operations.step3'] = f.wa7_break;
  if (d.growthEngine) fields['wachstum.channels'] = (fields['wachstum.channels']||'')+(fields['wachstum.channels']?'\n':'')+'Growth Engine: '+d.growthEngine;
  return Object.keys(fields).length ? fields : null;
}

function mapS2Old(d) {
  const a = d.assignments || {};
  const fields = {};
  if (a.p4_name) fields['produkt.productName'] = a.p4_name;
  if (a.p4_desc) fields['produkt.description'] = a.p4_desc;
  if (a.p4_target) fields['produkt.targetGroup'] = a.p4_target;
  if (a.p4_price) fields['produkt.priceModel'] = [a.p4_price, a.p4_unit].filter(Boolean).join(' · ');
  if (a.p4_value) fields['geschaeftsmodell.valueProposition'] = a.p4_value;
  if (a.p3_market) fields['markt.marketOverview'] = a.p3_market;
  if (a.p3_competition) fields['markt.competition'] = a.p3_competition;
  if (a.p3_transfer) fields['markt.transferInsights'] = a.p3_transfer;
  if (a.p3_customers) fields['kunden.customerProfiles'] = a.p3_customers;
  if (a.p4_cproblem) fields['kunden.painPoints'] = a.p4_cproblem;
  if (a.p4_motivation) fields['kunden.motivation'] = a.p4_motivation;
  if (a.p5_problem) fields['pitch.problemStatement'] = a.p5_problem;
  if (a.p5_target) fields['pitch.targetStatement'] = a.p5_target;
  if (a.p5_product) fields['pitch.solutionStatement'] = a.p5_product;
  return { _session: 2, teamName: d.teamName, productName: d.productName||d.assignments?.p4_name||'', fields };
}

function mapS2New(d) {
  const aw = d.arbeitsauftraege || {};
  const pf = aw['Produktprofil – alle Pflichtfelder'] || {};
  const pit = aw['Pitch – Dokumentierter Text'] || {};
  const anal = aw['Situationsanalyse – Befunde'] || {};
  const fields = {};
  const clean = (v) => (v && v !== '(nicht ausgefüllt)') ? v : null;
  if (clean(pf['Produktname'])) fields['produkt.productName'] = pf['Produktname'];
  if (clean(pf['Kurzbeschreibung'])) fields['produkt.description'] = pf['Kurzbeschreibung'];
  if (clean(pf['Zielkund:in'])) fields['produkt.targetGroup'] = pf['Zielkund:in'];
  if (clean(pf['Preis / Preislogik'])) fields['produkt.priceModel'] = [pf['Preis / Preislogik'], pf['Einheit']].filter(clean).join(' · ');
  if (clean(pf['Problem aus Kundensicht'])) fields['kunden.painPoints'] = pf['Problem aus Kundensicht'];
  if (clean(pf['Kaufmotivation'])) fields['kunden.motivation'] = pf['Kaufmotivation'];
  if (clean(pf['Wahrgenommener Mehrwert'])) fields['geschaeftsmodell.valueProposition'] = pf['Wahrgenommener Mehrwert'];
  if (clean(anal['Marktbefund'])) fields['markt.marketOverview'] = anal['Marktbefund'];
  if (clean(anal['Wettbewerbsbefund'])) fields['markt.competition'] = anal['Wettbewerbsbefund'];
  if (clean(anal['Kundenbefund'])) fields['kunden.customerProfiles'] = anal['Kundenbefund'];
  if (clean(anal['Transfer – Bestätigen / Verwerfen / Schärfen'])) fields['markt.transferInsights'] = anal['Transfer – Bestätigen / Verwerfen / Schärfen'];
  if (clean(pit['Problem'])) fields['pitch.problemStatement'] = pit['Problem'];
  if (clean(pit['Zielgruppe'])) fields['pitch.targetStatement'] = pit['Zielgruppe'];
  if (clean(pit['Produkt'])) fields['pitch.solutionStatement'] = pit['Produkt'];
  return { _session: 2, teamName: d.teamName, productName: d.productName || pf['Produktname'] || '', fields };
}

function mapS4(d) {
  const ctx = d.contextCanvas || {};
  const bmc = d.businessModel || {};
  const proc = d.prozess || {};
  const eth = d.ethicsTest || {};
  const fin = d.oekonomischeLogik || {};
  const pit = d.pitch || {};
  const clean = (v) => (v && v !== '(nicht ausgefüllt)') ? v : null;
  const fields = {};
  // Context Canvas
  if (clean(ctx['DEMOGRAFIE'])) fields['markt.demographic'] = ctx['DEMOGRAFIE'];
  if (clean(ctx['WETTBEWERB'])) fields['markt.competition'] = ctx['WETTBEWERB'];
  if (clean(ctx['TECHNOLOGIE'])) fields['markt.trends'] = ctx['TECHNOLOGIE'];
  if (clean(ctx['WIRTSCHAFT'])) fields['markt.economy'] = ctx['WIRTSCHAFT'];
  if (clean(ctx['REGULIERUNG'])) fields['markt.regulation'] = ctx['REGULIERUNG'];
  if (clean(ctx['TRENDS'])) fields['markt.trends'] = (fields['markt.trends']||'') + (fields['markt.trends']?'\n\n':'')+ctx['TRENDS'];
  if (clean(ctx['UNSICHERHEITEN'])) fields['markt.uncertainty'] = ctx['UNSICHERHEITEN'];
  // BMC
  if (clean(bmc['VALUE PROPOSITIONS'])) fields['geschaeftsmodell.valueProposition'] = bmc['VALUE PROPOSITIONS'];
  if (clean(bmc['KEY ACTIVITIES'])) fields['geschaeftsmodell.keyActivities'] = bmc['KEY ACTIVITIES'];
  if (clean(bmc['KEY RESOURCES'])) fields['geschaeftsmodell.keyResources'] = bmc['KEY RESOURCES'];
  if (clean(bmc['KEY PARTNERS'])) fields['geschaeftsmodell.keyPartners'] = bmc['KEY PARTNERS'];
  if (clean(bmc['REVENUE STREAMS'])) fields['geschaeftsmodell.revenueModel'] = bmc['REVENUE STREAMS'];
  if (clean(bmc['COST STRUCTURE'])) fields['geschaeftsmodell.costStructure'] = bmc['COST STRUCTURE'];
  if (clean(bmc['CUSTOMER SEGMENTS'])) fields['kunden.segments'] = bmc['CUSTOMER SEGMENTS'];
  if (clean(bmc['CUSTOMER RELATIONSHIPS'])) fields['kunden.relationships'] = bmc['CUSTOMER RELATIONSHIPS'];
  if (clean(bmc['CHANNELS'])) fields['wachstum.channels'] = bmc['CHANNELS'];
  // Process
  const pkeys = Object.keys(proc);
  const findProc = (n) => pkeys.find(k=>k.includes('0'+n)||k.toUpperCase().includes(['','KUNDE','TRANSFORMATION','ANGEBOT','UMSATZ'][n]));
  if (clean(proc[findProc(1)]||proc['01 · KUNDE & PROBLEM'])) fields['operations.step1'] = proc[findProc(1)]||proc['01 · KUNDE & PROBLEM'];
  if (clean(proc[findProc(2)]||proc['02 · TRANSFORMATION'])) fields['operations.step2'] = proc[findProc(2)]||proc['02 · TRANSFORMATION'];
  if (clean(proc[findProc(3)]||proc['03 · ANGEBOT'])) fields['operations.step3'] = proc[findProc(3)]||proc['03 · ANGEBOT'];
  if (clean(proc[findProc(4)]||proc['04 · UMSATZ'])) fields['operations.step4'] = proc[findProc(4)]||proc['04 · UMSATZ'];
  // Ethics
  const ekeys = Object.keys(eth);
  const findEth = (kw) => ekeys.find(k=>k.toUpperCase().includes(kw));
  if (findEth('WOHLTUN')&&clean(eth[findEth('WOHLTUN')])) fields['ethik.wohltun'] = eth[findEth('WOHLTUN')];
  if (findEth('NICHTSCHADEN')&&clean(eth[findEth('NICHTSCHADEN')])) fields['ethik.nichtschaden'] = eth[findEth('NICHTSCHADEN')];
  if (findEth('AUTONOMIE')&&clean(eth[findEth('AUTONOMIE')])) fields['ethik.autonomie'] = eth[findEth('AUTONOMIE')];
  if (findEth('GERECHTIGKEIT')&&clean(eth[findEth('GERECHTIGKEIT')])) fields['ethik.gerechtigkeit'] = eth[findEth('GERECHTIGKEIT')];
  if (findEth('ERKL')&&clean(eth[findEth('ERKL')])) fields['ethik.erklaerbarkeit'] = eth[findEth('ERKL')];
  if (findEth('RISIKEN')&&clean(eth[findEth('RISIKEN')])) fields['ethik.risks'] = eth[findEth('RISIKEN')];
  if (findEth('GEGENMASSNAHMEN')&&clean(eth[findEth('GEGENMASSNAHMEN')])) fields['ethik.countermeasures'] = eth[findEth('GEGENMASSNAHMEN')];
  // Finance
  if (clean(fin['EINNAHMEN'])) fields['finanzen.revenue'] = fin['EINNAHMEN'];
  if (clean(fin['KOSTENSTRUKTUR'])) fields['finanzen.costs'] = fin['KOSTENSTRUKTUR'];
  const burKey = Object.keys(fin).find(k=>k.includes('BURN'));
  if (burKey&&clean(fin[burKey])) fields['finanzen.burnRate'] = fin[burKey];
  const runKey = Object.keys(fin).find(k=>k.includes('RUNWAY'));
  if (runKey&&clean(fin[runKey])) fields['finanzen.runway'] = fin[runKey];
  if (clean(fin['WACHSTUMSPFAD'])) fields['wachstum.growthPath'] = fin['WACHSTUMSPFAD'];
  if (clean(fin['FINANZIERUNGSFORM'])) fields['finanzen.financing'] = fin['FINANZIERUNGSFORM'];
  // Pitch
  if (clean(pit['PRODUKT'])) fields['pitch.solutionStatement'] = pit['PRODUKT'];
  if (clean(pit['MODELL'])) fields['pitch.modelStatement'] = pit['MODELL'];
  if (clean(pit['PROZESS'])) fields['pitch.processStatement'] = pit['PROZESS'];
  if (clean(pit['FINANZEN'])) fields['pitch.financeStatement'] = pit['FINANZEN'];
  return { _session: 4, teamName: d.teamName, productName: d.productName || '', fields };
}

    mods[m.id] = { fields, feedback: { originalAssumption:'', receivedFeedback:'', adaptation:'', reasoning:'' }, status:'locked', importedFrom:null, lastUpdated:null };
  });
  return {
    venture: { name:'', tagline:'', teamMembers:'', startSession:2 },
    sessions: {},
    modules: mods,
    assumptions: [],
    feedbackLog: [],
    nextMission: '',
    setupDone: false,
    consistency: {},
    reality: { engpass:'', unsicherheit:'', evidenz:'', regulierung:'', skalierung:'' },
    health: {},
    demoday: {},
  };
}

function load() { try { const d=localStorage.getItem(STORE); S=d?{...defaultState(),...JSON.parse(d)}:defaultState(); } catch { S=defaultState(); } }
function save() { try { localStorage.setItem(STORE,JSON.stringify(S)); } catch {} try{showSaved();}catch{} }
let saveT; function debouncedSave() { clearTimeout(saveT); saveT=setTimeout(save,400); }

// ═══════════════════════════════════════════════════════════
//  COMPUTED
// ═══════════════════════════════════════════════════════════
function moduleCompletion(mid) {
  const mod = MODULES.find(m=>m.id===mid);
  const mstate = S.modules[mid];
  if(!mod||!mstate)return 0;
  const total = mod.fields.length;
  const done = mod.fields.filter(f=>(mstate.fields[f.id]||'').trim().length>10).length;
  return total?Math.round(done/total*100):0;
}
function overallCompletion() {
  const scores = MODULES.map(m=>moduleCompletion(m.id));
  return Math.round(scores.reduce((a,b)=>a+b,0)/MODULES.length);
}
function modulesImported() { return MODULES.filter(m=>S.modules[m.id].status!=='locked').length; }
function getNextMission() {
  const imported = modulesImported();
  if (!S.setupDone) return { icon:'🚀', text:'Venture-Profil einrichten', action:'#setup' };
  if (imported===0) return { icon:'⬇', text:'Erste Session-Abgabe importieren', action:'#import' };
  const pendingFb = S.feedbackLog.filter(f=>f.status==='pending');
  if (pendingFb.length>0) return { icon:'⚠️', text:`Feedback aus ${pendingFb.length} Session(s) integrieren`, action:`#modul/${S.modules[Object.keys(S.modules)[0]]?.importedFrom?.split('.')[0]||'produkt'}` };
  const incomplete = MODULES.filter(m=>moduleCompletion(m.id)<50&&S.modules[m.id].status!=='locked');
  if (incomplete.length>0) return { icon:'✍️', text:`${incomplete[0].title} vervollständigen`, action:`#modul/${incomplete[0].id}` };
  return { icon:'✅', text:'Alle aktiven Module vollständig', action:'#output/businessplan' };
}
function getStatusMeta(status) {
  const map = {
    locked:    {color:'#6A6080',label:'Noch nicht bearbeitet',icon:'\u26AA',cls:'status-locked'},
    draft:     {color:'#6A6080',label:'Noch nicht bearbeitet',icon:'\u26AA',cls:'status-draft'},
    imported:  {color:'#E8C24A',label:'In Bearbeitung',icon:'\u{1F7E1}',cls:'status-imported'},
    revised:   {color:'#E8C24A',label:'In Bearbeitung',icon:'\u{1F7E1}',cls:'status-revised'},
    validated: {color:'#5ABF8C',label:'Vollst\u00e4ndig',icon:'\u{1F7E2}',cls:'status-validated'},
  };
  return map[status]||map.locked;
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg,color='#C87C38',dur=2800){
  const c=document.getElementById('toasts');const el=document.createElement('div');
  el.className='toast';el.style.borderLeftColor=color;el.textContent=msg;
  c.appendChild(el);setTimeout(()=>el.remove(),dur+300);}
function uid(){return Math.random().toString(36).slice(2,9);}
function now(){return new Date().toLocaleDateString('de-DE');}

  currentRoute=route;

function handleHash() {
  const h=window.location.hash.slice(1)||'dashboard';
  currentRoute=h;

function renderView() {
  const v=document.getElementById('view');
  const [page,...parts]=currentRoute.split('/');
  if(page==='dashboard'||page==='')v.innerHTML=renderDashboard();
  else if(page==='modul')v.innerHTML=renderModule(parts[0]);

  else if(page==='integration')v.innerHTML=renderIntegration();
  else if(page==='consistency')v.innerHTML=renderConsistency();
  else if(page==='reality')v.innerHTML=renderReality();
  else if(page==='maturity')v.innerHTML=renderMaturity();
  else if(page==='pitch-mode')v.innerHTML=renderPitchMode();
  else if(page==='evolution')v.innerHTML=renderFeedbackEvolution();
  else if(page==='assumptions')v.innerHTML=renderAssumptionsView();
  else if(page==='health')v.innerHTML=renderHealthCheck();
  else if(page==='demoday')v.innerHTML=renderDemoDayReadiness();
  else if(page==='guide')v.innerHTML=renderGuide();
  else v.innerHTML=renderDashboard();
  attachViewEvents();
}

let importPreview=null;
function openImportModal() {
  importPreview=null;
  const modal=document.getElementById('import-modal-inner');
  modal.innerHTML=`
    <div class="modal-header">
      <div class="modal-title">⬇ Session-Daten importieren</div>
      <div class="modal-close" onclick="closeImportModal()">✕</div>
    </div>
    <div class="modal-body">
      <div style="font-size:13px;color:var(--dim);line-height:1.6">
        Session-JSON aus der Abgabe importieren. Das System erkennt das Format automatisch und mappt die Felder auf die Module.
        <strong style="color:var(--text)"> Bestehende Felder werden mit Zustimmung überschrieben.</strong>
      </div>
      <div class="drop-zone" id="drop-zone">
        <div class="drop-icon">📂</div>
        <div class="drop-title">JSON-Datei hierher ziehen</div>
        <div class="drop-sub">oder klicken · <strong style="color:var(--gold)">ECL_S2_*.json · ECL_S4_*.json</strong></div>
      </div>
      <div id="import-preview-area"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeImportModal()">Abbrechen</button>
      <button class="btn btn-gold" id="btn-confirm-import" disabled style="opacity:.4">Importieren</button>
    </div>`;
  document.getElementById('import-modal').classList.add('open');
  attachImportEvents();
}
function closeImportModal() { document.getElementById('import-modal').classList.remove('open'); }

function attachImportEvents() {
  const dz=document.getElementById('drop-zone');
  const fi=document.getElementById('file-inp');
  dz.addEventListener('click',()=>fi.click());
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag');});
  dz.addEventListener('dragleave',()=>dz.classList.remove('drag'));
  dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag');readImportFiles(e.dataTransfer.files);});
  fi.addEventListener('change',e=>{readImportFiles(e.target.files);fi.value='';});
  document.getElementById('btn-confirm-import')?.addEventListener('click',confirmImport);
}

function readImportFile(file) {
  if(!file) return;
  const r=new FileReader();
  r.onload=ev=>{
    try {
      const data=JSON.parse(ev.target.result);
      importPreview=detectAndMap(data);
      if(!importPreview){toast('❌ Format nicht erkannt','#F87171');return;}
      if(importPreview._isFeedback){handleFeedbackImport(importPreview);return;}
      showImportPreview(importPreview);
    } catch { toast('❌ Fehler beim Lesen der Datei','#F87171'); }
  };
  r.readAsText(file);
}

function readImportFiles(fileList){
  const files=[...fileList];
  if(files.length<=1){ readImportFile(files[0]); return; }
  // Multiple files: skip preview, parse & apply all directly
  let pending=files.length, fieldCount=0, fbCount=0, sessions=new Set(), errors=0;
  files.forEach(file=>{
    const r=new FileReader();
    r.onload=ev=>{
      try {
        const data=JSON.parse(ev.target.result);
        const preview=detectAndMap(data);
        if(!preview){errors++;}
        else if(preview._isFeedback){handleFeedbackImportSilent(preview);fbCount++;sessions.add(preview._session);}
        else {fieldCount+=applyImportData(preview);sessions.add(preview._session);}
      } catch { errors++; }
      if(--pending===0){
        save();closeImportModal();renderSidebar();renderView();
        const sList=[...sessions].sort().join(', ');
        let msg=`✅ ${files.length} Dateien verarbeitet (Sessions ${sList})`;
        if(fieldCount) msg=`✅ ${fieldCount} Felder + ${fbCount} Feedback aus Sessions ${sList}`;
        if(errors) msg+=` · ${errors} Fehler`;
        toast(msg,errors?'#E8C24A':'#34D399',4000);
      }
    };
    r.readAsText(file);
  });
}

function handleFeedbackImportSilent(imp) {
  const fb=imp.data.feedback||{};const overall=imp.data.overallFeedback||'';
  S.feedbackLog.unshift({
    id:uid(),session:imp._session,date:now(),
    source:imp.data.profName||'Dozent:in',
    preview:(overall||Object.values(fb)[0]||'').slice(0,80)+'…',
    status:'pending',rawFeedback:fb,overallFeedback:overall,
  });
}
function handleFeedbackImport(imp) {
  handleFeedbackImportSilent(imp);
  save();closeImportModal();renderSidebar();renderView();
  toast(`📬 Feedback aus Session ${imp._session} importiert`,'#34D399');
}

function showImportPreview(preview) {
  const items=Object.entries(preview.fields).slice(0,8).map(([key,val])=>{
    const [mid,fid]=key.split('.');
    const mod=MODULES.find(m=>m.id===mid);
    const field=mod?.fields.find(f=>f.id===fid);
    return `<div class="import-preview-item">
      <span class="import-preview-key">${mod?.icon||'→'} ${field?.label||key}</span>
      <strong>${esc(String(val).slice(0,60)+(val.length>60?'…':''))}</strong>
    </div>`;}).join('');
  const total=Object.keys(preview.fields).length;
  const area=document.getElementById('import-preview-area');
  if(area) area.innerHTML=`<div class="import-preview">
    <div class="import-preview-title">✓ Session ${preview._session} erkannt · ${total} Felder werden befüllt
      ${preview.teamName?` · Team: <span style="color:var(--text)">${esc(preview.teamName)}</span>`:''}</div>
    ${items}
    ${total>8?`<div style="font-size:11px;color:var(--dim);margin-top:6px">+${total-8} weitere Felder…</div>`:''}
  </div>`;
  const btn=document.getElementById('btn-confirm-import');
  if(btn){btn.disabled=false;btn.style.opacity='1';}
}

function applyImportData(preview){
  const {_session,teamName,productName,fields}=preview;
  let count=0;
  Object.entries(fields).forEach(([key,val])=>{
    const [mid,fid]=key.split('.');
    if(S.modules[mid]&&S.modules[mid].fields.hasOwnProperty(fid)){
      S.modules[mid].fields[fid]=val;
      if(S.modules[mid].status==='locked') S.modules[mid].status='imported';
      S.modules[mid].importedFrom=`Session ${_session}`;
      S.modules[mid].lastUpdated=now();
      count++;
    }
  });
  if(teamName&&!S.venture.name) S.venture.name=teamName;
  if(productName&&!S.venture.name) S.venture.name=productName;
  if(!S.sessions[_session]) S.sessions[_session]='imported';
  S.setupDone=true;
  return count;
}
function confirmImport() {
  if(!importPreview) return;
  const _session=importPreview._session;
  const count=applyImportData(importPreview);
  save();closeImportModal();renderSidebar();renderView();
  toast(`✅ ${count} Felder aus Session ${_session} importiert`,'#34D399',3500);
}

function deleteAssumption(id){S.assumptions=S.assumptions.filter(a=>a.id!==id);save();closeImportModal();renderView();toast('Annahme gelöscht','#F87171');}
function saveAssumption(editId) {
  const text=document.getElementById('asm-text')?.value?.trim();
  if(!text) return;
  const obj={id:editId||uid(),text,
    category:document.getElementById('asm-cat')?.value||'allgemein',
    status:document.getElementById('asm-status')?.value||'unvalidated',
    evidenceStrength:document.getElementById('asm-ev')?.value||'schwach',
    riskLevel:document.getElementById('asm-rl')?.value||'hoch',
    nextStep:(document.getElementById('asm-next')?.value||'').trim(),
    date:now()};
  if(editId){const idx=S.assumptions.findIndex(a=>a.id===editId);if(idx>=0)S.assumptions[idx]=obj;else S.assumptions.push(obj);}
  else S.assumptions.push(obj);
  save();closeImportModal();renderView();
  toast('✅ Annahme gespeichert','#34D399');
}

function attachViewEvents() {
  // Setup save
  document.getElementById('setup-save')?.addEventListener('click',()=>{
    S.venture.name=document.getElementById('setup-name')?.value||S.venture.name;
    S.venture.tagline=document.getElementById('setup-tag')?.value||S.venture.tagline;
    S.venture.teamMembers=document.getElementById('setup-team')?.value||S.venture.teamMembers;
    S.setupDone=true;save();renderSidebar();renderView();toast('✅ Venture-Profil gespeichert','#34D399');
  });
  // Module fields
  document.querySelectorAll('.field-input[data-mid],.field-textarea[data-mid]').forEach(el=>{
    el.addEventListener('input',e=>{
      const mid=e.target.dataset.mid;const fid=e.target.dataset.fid;const fbk=e.target.dataset.fbk;
      if(fid) S.modules[mid].fields[fid]=e.target.value;
      if(fbk) S.modules[mid].feedback[fbk]=e.target.value;
      if(S.modules[mid].status==='locked') S.modules[mid].status='draft';
      // live char counter
      const val=e.target.value||'';const len=val.trim().length;
      const cc=e.target.nextElementSibling;
      if(cc?.classList.contains('field-char')){cc.textContent=len+' Zeichen'+(len>10?' ✓':' (min. 10)');cc.classList.toggle('ok',len>10);}
      debouncedSave();
    });
  });
  // Status selector
  document.querySelectorAll('.status-opt').forEach(el=>{
    el.addEventListener('click',()=>{
      const mid=el.dataset.mid;const status=el.dataset.status;
      if(!mid||!status)return;
      S.modules[mid].status=status;save();
      document.querySelectorAll(`.status-opt[data-mid="${mid}"]`).forEach(o=>{o.classList.toggle('selected',o.dataset.status===status);});
      renderSidebar();
    });
  });
  // Assumption items (toggle status on click)
  document.querySelectorAll('.assumption-item [data-asm-id]').forEach(el=>{
    el.addEventListener('click',()=>{
      const id=el.dataset.asmId;const a=S.assumptions.find(x=>x.id===id);
      if(!a)return;
      const cycle=['unvalidated','confirmed','refuted'];
      a.status=cycle[(cycle.indexOf(a.status)+1)%cycle.length];
      save();renderView();
    });
  });
  // Module cards on dashboard
  document.querySelectorAll('.mod-card').forEach(el=>{
    el.addEventListener('click',e=>{e.preventDefault();navigate(el.getAttribute('href').slice(1));});
  });
  // Prototype: photo upload (downscaled to keep localStorage small)
  document.getElementById('photo-upload-input')?.addEventListener('change',e=>{
    const mstate=S.modules.prototype; mstate.photos=mstate.photos||[];
    [...e.target.files].forEach(file=>{
      const img=new Image(); const reader=new FileReader();
      reader.onload=ev=>{ img.onload=()=>{
        const max=900; let w=img.width,h=img.height;
        if(w>max||h>max){ const r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        mstate.photos.push(canvas.toDataURL('image/jpeg',0.75));
        save();renderView();toast('📷 Foto hinzugefügt','#5ABF8C');
      }; img.src=ev.target.result; };
      reader.readAsDataURL(file);
    });
  });
  document.querySelectorAll('[data-photo-del]').forEach(el=>{
    el.addEventListener('click',()=>{
      S.modules.prototype.photos.splice(+el.dataset.photoDel,1);
      save();renderView();
    });
  });
  // Reality Check textareas
  document.querySelectorAll('[data-reality]').forEach(el=>{
    el.addEventListener('input',e=>{
      S.reality[e.target.dataset.reality]=e.target.value;
      debouncedSave();
    });
  });
  // Consistency Check: status buttons + reasoning textareas
  document.querySelectorAll('[data-ccid]').forEach(el=>{
    el.addEventListener('click',()=>{
      const id=el.dataset.ccid, val=el.dataset.ccval;
      S.consistency[id+'_status']=(S.consistency[id+'_status']===val)?'':val;
      save();renderView();
    });
  });
  document.querySelectorAll('[data-cctext]').forEach(el=>{
    el.addEventListener('input',e=>{
      S.consistency[e.target.dataset.cctext+'_text']=e.target.value;
      debouncedSave();
    });
  });
  // Health Check: status dots + reasoning
  document.querySelectorAll('[data-health]').forEach(el=>{
    el.addEventListener('click',()=>{
      const id=el.dataset.health, st=el.dataset.hstatus;
      S.health[id+'_status']=(S.health[id+'_status']===st)?'':st;
      save();renderView();
    });
  });
  document.querySelectorAll('[data-health-reason]').forEach(el=>{
    el.addEventListener('input',e=>{
      S.health[e.target.dataset.healthReason+'_reason']=e.target.value;
      debouncedSave();
    });
  });
  // Demo Day Readiness checklist
  document.querySelectorAll('[data-demoday]').forEach(el=>{
    el.addEventListener('change',e=>{
      S.demoday[e.target.dataset.demoday]=e.target.checked;
      save();renderView();
    });
  });
}

function renderIntegration() {
  const statusColor = m => { const s=S.modules[m]?.status||'locked'; return {locked:'#DDD8CC',draft:'#C87C38',imported:'#2A7E7E',revised:'#818CF8',validated:'#34D399'}[s]||'#DDD8CC'; };
  const completion = m => { const mod=MODULES.find(x=>x.id===m); const ms=S.modules[m]; if(!mod||!ms)return 0; const done=mod.fields.filter(f=>(ms.fields[f.id]||'').trim().length>10).length; return mod.fields.length?Math.round(done/mod.fields.length*100):0; };
  const opacity = m => { const c=completion(m); return Math.max(0.3, c/100); };

  // Node positions in 600x440 SVG
  const nodes = [
    {id:'produkt',   label:'Produkt',       x:300, y:70,  icon:'📦'},
    {id:'markt',     label:'Markt',          x:130, y:155, icon:'🌍'},
    {id:'kunden',    label:'Kunden',         x:470, y:155, icon:'👥'},
    {id:'ethik',     label:'Ethik',          x:60,  y:270, icon:'⚖️'},
    {id:'geschaeftsmodell',label:'Geschäfts\u00admodell',x:300,y:220,icon:'🧩'},
    {id:'operations',label:'Operations',    x:540, y:270, icon:'⚙️'},
    {id:'wachstum',  label:'Wachstum',       x:160, y:370, icon:'📈'},
    {id:'finanzen',  label:'Finanzen',       x:440, y:370, icon:'💰'},
    {id:'kennzahlen',label:'KPIs',           x:80,  y:420, icon:'📊'},
    {id:'pitch',     label:'Pitch',          x:520, y:420, icon:'🎯'},
  ];

  // Connections with labels
  const edges = [
    {a:'produkt',b:'kunden',label:'löst Problem von'},
    {a:'produkt',b:'geschaeftsmodell',label:'erzeugt Wert für'},
    {a:'markt',b:'produkt',label:'gibt Kontext'},
    {a:'kunden',b:'geschaeftsmodell',label:'zahlt für'},
    {a:'geschaeftsmodell',b:'finanzen',label:'generiert'},
    {a:'geschaeftsmodell',b:'operations',label:'braucht'},
    {a:'geschaeftsmodell',b:'ethik',label:'muss verantwortet werden'},
    {a:'operations',b:'wachstum',label:'muss skalieren'},
    {a:'wachstum',b:'finanzen',label:'treibt an'},
    {a:'kunden',b:'kennzahlen',label:'validiert'},
    {a:'finanzen',b:'pitch',label:'belegt'},
    {a:'produkt',b:'pitch',label:'kommuniziert'},
  ];

  const getNode = id => nodes.find(n=>n.id===id);

  const edgeSvg = edges.map(e => {
    const a=getNode(e.a), b=getNode(e.b);
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="rgba(42,126,126,0.12)" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="${mx}" y="${my-4}" fill="rgba(42,126,126,0.4)" font-size="7.5" text-anchor="middle" font-family="DM Sans">${e.label}</text>`;
  }).join('');

  const nodeSvg = nodes.map(n => {
    const col = statusColor(n.id);
    const op = opacity(n.id);
    const pct = completion(n.id);
    return `<g class="map-node" onclick="navigate('modul/${n.id}')" opacity="${op}" title="${n.label} · ${pct}%">
      <circle cx="${n.x}" cy="${n.y}" r="30" fill="${col}" fill-opacity="0.18" stroke="${col}" stroke-width="1.5"/>
      <circle cx="${n.x}" cy="${n.y}" r="28" fill="transparent" stroke="${col}" stroke-width="0.5" stroke-opacity="0.4"/>
      <text x="${n.x}" y="${n.y-5}" text-anchor="middle" font-size="16" dominant-baseline="middle">${n.icon}</text>
      <text x="${n.x}" y="${n.y+16}" text-anchor="middle" fill="${col}" font-size="8.5" font-family="Syne" font-weight="700">${n.label}</text>
      <text x="${n.x}" y="${n.y+26}" text-anchor="middle" fill="${col}" font-size="7" font-family="DM Sans" opacity="0.6">${pct}%</text>
    </g>`;
  }).join('');

  const legendItems = [
    {color:'#DDD8CC',label:'Gesperrt'},{color:'#C87C38',label:'Entwurf'},
    {color:'#2A7E7E',label:'Importiert'},{color:'#818CF8',label:'Überarbeitet'},{color:'#34D399',label:'Validiert'},
  ].map(l=>`<div class="map-legend-item"><div class="map-legend-dot" style="background:${l.color}"></div>${l.label}</div>`).join('');

  // Consistency quick-check summary
  const ccStates = ['produkt_kunden','gm_markt','ops_wachstum','fin_wachstum','ethik_gm','kpi_kunde'].map(k=>S.consistency[k+'_status']||'');
  const okCount = ccStates.filter(s=>s==='ok').length;
  const warnCount = ccStates.filter(s=>s==='warn').length;
  const badCount = ccStates.filter(s=>s==='bad').length;

  return `<div style="max-width:900px">
    <div class="view-title">🗺 Venture Logic Map</div>
    <div class="view-sub">Systemansicht aller Module und ihrer Abhängigkeiten. Klicke auf einen Knoten um das Modul zu öffnen. Knotengröße = Bearbeitungsstand.</div>
    <div class="view-section" style="padding:18px">
      <div class="map-wrap">
        <svg viewBox="0 0 600 460" xmlns="http://www.w3.org/2000/svg">
          <defs><radialGradient id="bg" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#221F30"/><stop offset="100%" stop-color="#0F0D15"/></radialGradient></defs>
          <rect width="600" height="460" fill="url(#bg)"/>
          ${edgeSvg}
          ${nodeSvg}
        </svg>
      </div>
      <div class="map-legend">${legendItems}</div>
    </div>
    <div class="view-section">
      <div class="view-section-title">Konsistenz-Schnellübersicht</div>
      <div class="cc-summary">
        <div class="cc-summary-chip" style="background:rgba(52,211,153,.12);color:#34D399;border:1px solid rgba(52,211,153,.25)">✓ ${okCount} Konsistent</div>
        <div class="cc-summary-chip" style="background:rgba(200,124,56,.12);color:#C87C38;border:1px solid rgba(200,124,56,.25)">⚠ ${warnCount} Spannung</div>
        <div class="cc-summary-chip" style="background:rgba(248,113,113,.12);color:#F87171;border:1px solid rgba(248,113,113,.25)">✗ ${badCount} Widerspruch</div>
        <a href="#consistency" style="margin-left:auto;font-size:11.5px;color:#2A7E7E;font-family:'Syne',sans-serif;font-weight:700;text-decoration:none">→ Zur Konsistenzprüfung</a>
      </div>
    </div>
  </div>`;
}

function renderConsistency() {
  const getStatus = id => S.consistency[id+'_status'] || '';
  const statusMeta = s => ({
    ok:  {label:'Konsistent',cls:'ok', color:'#34D399',bg:'rgba(52,211,153,.08)'},
    warn:{label:'Spannung',  cls:'warn',color:'#C87C38',bg:'rgba(200,124,56,.08)'},
    bad: {label:'Widerspruch',cls:'bad',color:'#F87171',bg:'rgba(248,113,113,.08)'},
    '': {label:'Offen',cls:'',color:'#7068A0',bg:'transparent'},
  })[s]||{label:'Offen',cls:'',color:'#7068A0',bg:'transparent'};

  const allStatuses = CC_PAIRS.map(p=>getStatus(p.id));
  const ok=allStatuses.filter(s=>s==='ok').length, warn=allStatuses.filter(s=>s==='warn').length, bad=allStatuses.filter(s=>s==='bad').length;

  const pairs = CC_PAIRS.map(p => {

function computeMaturityDim(moduleIds) {
  const statusScore = {locked:0,draft:1,imported:2,revised:3,validated:4};
  const scores = moduleIds.map(mid => {
    const ms = S.modules[mid];
    const mod = MODULES.find(m=>m.id===mid);
    if(!ms||!mod)return 0;
    const stS = statusScore[ms.status]||0;
    const done = mod.fields.filter(f=>(ms.fields[f.id]||'').trim().length>10).length;
    const compS = mod.fields.length ? Math.round(done/mod.fields.length*4) : 0;
    return Math.round((stS+compS)/2);
  });
  return Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
}

function renderMaturity() {
  const dims = [
    {label:'Marktverständnis',   mods:['markt','kunden'],            color:'#818CF8'},
    {label:'Produktreife',       mods:['produkt','pitch'],           color:'#2A7E7E'},
    {label:'Geschäftsmodell',    mods:['geschaeftsmodell','finanzen'],color:'#C87C38'},
    {label:'Operations',         mods:['operations','ethik'],        color:'#34D399'},
    {label:'Skalierungsfähigkeit',mods:['wachstum','kennzahlen'],    color:'#F87171'},
  ];
  const scores = dims.map(d=>computeMaturityDim(d.mods));
  const total = Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
  const totalLabel = ['Nicht gestartet','Erste Schritte','In Entwicklung','Solide Basis','Bereit für Demo Day','Investor Ready'][Math.min(total,5)];
  const maxS=4;

  // Radar SVG (5 axes, pentagon, 300x300)
  const cx=150,cy=150,r=100;
  const angle = i => (Math.PI*2/5)*i - Math.PI/2;
  const point = (i,v) => { const a=angle(i),rv=r*(v/maxS); return [cx+rv*Math.cos(a), cy+rv*Math.sin(a)]; };
  const gridLines = [0.25,0.5,0.75,1].map(f=>{
    const pts=Array.from({length:5},(_,i)=>point(i,maxS*f).join(',')).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>`;
  }).join('');
  const axes = Array.from({length:5},(_,i)=>{const [x,y]=point(i,maxS);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(180,160,220,.1)" stroke-width="1"/>`;}).join('');
  const dataPoints = scores.map((s,i)=>point(i,s).join(',')).join(' ');
  const dimLabels = dims.map((d,i)=>{const a=angle(i),lx=cx+(r+22)*Math.cos(a),ly=cy+(r+22)*Math.sin(a);
    return `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="${d.color}" font-size="9" font-family="Syne" font-weight="700">${d.label}</text>`;}).join('');

  const bars = dims.map((d,i)=>`<div class="maturity-dim">
    <div class="maturity-dim-head">
      <div class="maturity-dim-label">${d.label}</div>
      <div class="maturity-dim-score" style="color:${d.color}">${scores[i]}/4</div>
    </div>
    <div class="maturity-bar-track">
      <div class="maturity-bar-fill" style="width:${scores[i]/4*100}%;background:${d.color}"></div>
    </div>
    <div style="font-size:10px;color:#7068A0;margin-top:2px">${['Nicht gestartet','Entwurf','Importiert','Überarbeitet','Validiert'][scores[i]]}</div>
  </div>`).join('');

  return `<div style="max-width:860px">
    <div class="view-title">📊 Venture Maturity Score</div>
    <div class="view-sub">Kein Zeugnis – eine strategische Orientierung. Wo steht das Venture, und was braucht als nächstes Aufmerksamkeit?</div>
    <div class="view-section">
      <div class="maturity-wrap">
        <div class="maturity-radar">
          <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
            ${gridLines}${axes}
            <polygon points="${dataPoints}" fill="rgba(42,126,126,0.15)" stroke="#2A7E7E" stroke-width="2"/>
            ${dimLabels}
            ${scores.map((s,i)=>{const[x,y]=point(i,s);return `<circle cx="${x}" cy="${y}" r="5" fill="#2A7E7E" stroke="#F4F1EB" stroke-width="2"/>`;}).join('')}
          </svg>
          <div class="maturity-score-total">${total}/4</div>
          <div class="maturity-score-label">${totalLabel}</div>
        </div>
        <div class="maturity-dims">${bars}</div>
      </div>
    </div>
    <div class="view-section">
      <div class="view-section-title">Was bedeutet das?</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px">
        ${[{v:0,l:'Nicht gestartet',d:'Modul gesperrt oder leer'},{v:1,l:'Entwurf',d:'Erste Inhalte, noch unvollständig'},{v:2,l:'Importiert',d:'Sessiondaten übertragen'},{v:3,l:'Überarbeitet',d:'Nach Feedback angepasst'},{v:4,l:'Validiert',d:'Abgeschlossen und belegt'}]
          .map(s=>`<div style="background:var(--card);border:1px solid rgba(180,160,220,.1);border-radius:8px;padding:10px 12px">
            <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:18px;color:#2A7E7E;line-height:1">${s.v}/4</div>
            <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:11px;color:#FFFFFF;margin-top:4px">${s.l}</div>
            <div style="font-size:10.5px;color:#7068A0;margin-top:2px">${s.d}</div>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
}

function renderDemoDayReadiness() {
  var DD = S.demoday || (S.demoday={});
  function statusOf(secId, n){
    var checked=0;
    for(var i=0;i<n;i++) if(DD[secId+'_'+i]) checked++;
    var ratio=checked/n;
    if(ratio===1) return {c:'#5ABF8C',l:'green',label:'Demo-Day-ready'};
    if(ratio>=0.5) return {c:'#E8C24A',l:'yellow',label:'Fast bereit'};
    return {c:'#E07070',l:'red',label:'Nicht bereit'};
  }
  var sections = DEMODAY_SECTIONS.map(function(sec){
    var st=statusOf(sec.id, sec.items.length);
    var rows=sec.items.map(function(item,i){
      var key=sec.id+'_'+i, on=!!DD[key];
      return '<label style="display:flex;align-items:flex-start;gap:10px;padding:6px 0;cursor:pointer;font-size:12.5px;color:'+(on?'var(--text)':'var(--dim)')+'">'
        +'<input type="checkbox" data-demoday="'+key+'" '+(on?'checked':'')+' style="margin-top:2px;width:15px;height:15px;accent-color:'+st.c+'">'
        +'<span style="'+(on?'text-decoration:line-through;opacity:.7':'')+'">'+item+'</span></label>';
    }).join('');
    return '<div style="background:var(--card);border:1px solid '+st.c+'33;border-radius:10px;padding:14px 16px;margin-bottom:12px">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'
      +'<div style="font-family:Syne,sans-serif;font-weight:800;font-size:14px;color:var(--text)">'+sec.title+'</div>'
      +'<div style="font-family:Syne,sans-serif;font-weight:700;font-size:10.5px;padding:3px 10px;border-radius:20px;background:'+st.c+'20;color:'+st.c+'">'+(st.l==='green'?'\u{1F7E2}':st.l==='yellow'?'\u{1F7E1}':'\u{1F534}')+' '+st.label+'</div>'
      +'</div>'+rows+'</div>';
  }).join('');

  var allStatuses = DEMODAY_SECTIONS.map(function(sec){return statusOf(sec.id, sec.items.length).l;});

  {id:'market',  q:'Passt das Geschäftsmodell zur Marktlogik?',             hint:'Geschäftsmodell ↔ Markt & Kontext'},

  {id:'story',   q:'Ist die Pitch-Story konsistent?',                       hint:'Pitch Center · alle Module'},

function renderHealthCheck() {
  var H = S.health || (S.health={});
  var LV = {green:{c:'#5ABF8C',l:'Passt'},yellow:{c:'#E8C24A',l:'Teilweise'},red:{c:'#E07070',l:'Nicht gelöst'},'':{c:'#4A4070',l:'Offen'}};
  function row(item){
    var st=H[item.id+'_status']||'';
    var reason=esc(H[item.id+'_reason']||'');
    var dots=['green','yellow','red'].map(function(k){
      var on=st===k, lv=LV[k];
      return '<button data-health="'+item.id+'" data-hstatus="'+k+'" style="width:30px;height:30px;border-radius:50%;border:2px solid '+(on?lv.c:'rgba(180,160,220,.15)')+';background:'+(on?lv.c+'30':'transparent')+';cursor:pointer;font-size:13px">'+(on?'\u25CF':'')+'</button>';
    }).join('');
    return '<div style="background:var(--card);border:1px solid '+(LV[st]?LV[st].c+'33':'rgba(180,160,220,.1)')+';border-radius:10px;padding:14px 16px;margin-bottom:10px">'
      +'<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:8px">'
      +'<div><div style="font-family:Syne,sans-serif;font-weight:700;font-size:13.5px;color:var(--text)">'+item.q+'</div>'
      +'<div style="font-size:11px;color:var(--dim);margin-top:2px">'+item.hint+'</div></div>'
      +'<div style="display:flex;gap:6px;flex-shrink:0">'+dots+'</div></div>'
      +'<textarea data-health-reason="'+item.id+'" rows="2" placeholder="Kurze Begründung..." style="width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(180,160,220,.14);border-radius:6px;color:var(--text);font-family:DM Sans,sans-serif;font-size:12.5px;padding:7px 10px;outline:none;resize:vertical">'+reason+'</textarea>'
      +'</div>';
  }
  var statuses = HEALTH_QUESTIONS.map(function(it){return H[it.id+'_status']||'';});
  var green=statuses.filter(function(s){return s==='green';}).length;
  var yellow=statuses.filter(function(s){return s==='yellow';}).length;
  var red=statuses.filter(function(s){return s==='red';}).length;
  var open=statuses.filter(function(s){return !s;}).length;
  var score=Math.round(green/HEALTH_QUESTIONS.length*100);
  var todos=HEALTH_QUESTIONS.filter(function(it){return (H[it.id+'_status']||'')!=='green';})
    .map(function(it){return '<div style="font-size:12px;color:var(--text);padding:5px 0;border-bottom:1px solid rgba(180,160,220,.06)"><span style="color:'+(LV[H[it.id+'_status']||'']?LV[H[it.id+'_status']||''].c:'#4A4070')+'">\u25CF</span>&nbsp; '+it.q+'</div>';}).join('');

  return '<div style="max-width:780px">'
    +'<div class="view-title">\u{1F6A6} Venture Health Check</div>'
    +'<div class="view-sub">8 Kernfragen, die entscheiden, ob das Venture als Ganzes konsistent ist. Ampelstatus + kurze Begründung pro Frage.</div>'
    +'<div style="display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap">'
    +'<div style="background:var(--card);border:1px solid rgba(90,191,140,.25);border-radius:10px;padding:12px 16px;text-align:center;min-width:90px"><div style="font-family:Syne,sans-serif;font-weight:800;font-size:24px;color:#5ABF8C">'+score+'%</div><div style="font-size:9.5px;color:var(--dim);font-family:Syne,sans-serif;font-weight:700;text-transform:uppercase">Readiness Score</div></div>'
    +'<div style="background:var(--card);border:1px solid rgba(180,160,220,.1);border-radius:10px;padding:12px 16px;text-align:center;min-width:90px"><div style="font-family:Syne,sans-serif;font-weight:800;font-size:24px;color:#5ABF8C">'+green+'</div><div style="font-size:9.5px;color:var(--dim);font-family:Syne,sans-serif;font-weight:700;text-transform:uppercase">Passt</div></div>'
    +'<div style="background:var(--card);border:1px solid rgba(180,160,220,.1);border-radius:10px;padding:12px 16px;text-align:center;min-width:90px"><div style="font-family:Syne,sans-serif;font-weight:800;font-size:24px;color:#E8C24A">'+yellow+'</div><div style="font-size:9.5px;color:var(--dim);font-family:Syne,sans-serif;font-weight:700;text-transform:uppercase">Teilweise</div></div>'
    +'<div style="background:var(--card);border:1px solid rgba(180,160,220,.1);border-radius:10px;padding:12px 16px;text-align:center;min-width:90px"><div style="font-family:Syne,sans-serif;font-weight:800;font-size:24px;color:#E07070">'+red+'</div><div style="font-size:9.5px;color:var(--dim);font-family:Syne,sans-serif;font-weight:700;text-transform:uppercase">Ungelöst</div></div>'
    +'<div style="background:var(--card);border:1px solid rgba(180,160,220,.1);border-radius:10px;padding:12px 16px;text-align:center;min-width:90px"><div style="font-family:Syne,sans-serif;font-weight:800;font-size:24px;color:var(--dim)">'+open+'</div><div style="font-size:9.5px;color:var(--dim);font-family:Syne,sans-serif;font-weight:700;text-transform:uppercase">Offen</div></div>'
    +'</div>'
    +HEALTH_QUESTIONS.map(row).join('')
    +(todos?'<div style="margin-top:20px;background:var(--card);border:1px solid rgba(180,160,220,.1);border-radius:10px;padding:14px 16px"><div style="font-family:Syne,sans-serif;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:8px">Offene To-dos vor dem Pitch</div>'+todos+'</div>':'')
    +'</div>';
}
