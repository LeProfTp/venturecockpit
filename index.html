function renderAssumptionsView() {
  const evCol={stark:'#34D399',mittel:'#C87C38',schwach:'#F87171'};
  const rlCol={hoch:'#F87171',mittel:'#C87C38',niedrig:'#34D399'};
  const stCol={unvalidated:'#C87C38',confirmed:'#34D399',refuted:'#F87171'};
  const stLbl={unvalidated:'Offen',confirmed:'Bestätigt ✓',refuted:'Widerlegt ✗'};
  function chip(txt,col){return '<span class="assump-chip" style="background:'+col+'18;color:'+col+';border:1px solid '+col+'44">'+txt+'</span>';}
  const high=S.assumptions.filter(function(a){return a.riskLevel==='hoch'&&a.evidenceStrength==='schwach';});
  function buildCard(a){
    var cc='assump-card '+(a.riskLevel==='hoch'?'risk-high':a.riskLevel==='mittel'?'risk-med':'risk-low');
    var meta=(a.evidenceStrength?chip({stark:'Evidenz: Stark',mittel:'Evidenz: Mittel',schwach:'Evidenz: Schwach'}[a.evidenceStrength]||a.evidenceStrength,evCol[a.evidenceStrength]||'#7068A0'):'')
      +(a.riskLevel?chip({hoch:'Risiko: Hoch',mittel:'Risiko: Mittel',niedrig:'Risiko: Niedrig'}[a.riskLevel]||a.riskLevel,rlCol[a.riskLevel]||'#7068A0'):'')
      +(a.category?chip(a.category,'#7068A0'):'')
      +chip(stLbl[a.status]||a.status,stCol[a.status]||'#7068A0');
    return '<div class="'+cc+'" onclick="openAssumptionModal(\''+a.id+'\')" style="cursor:pointer">'
      +'<div class="assump-text">'+esc(a.text)+'</div>'
      +'<div class="assump-meta">'+meta+'</div>'
      +(a.nextStep?'<div class="assump-next">→ '+esc(a.nextStep)+'</div>':'')
      +'</div>';
  }
  var cards=!S.assumptions.length
    ?('<div style="text-align:center;padding:48px"><div style="font-size:36px;margin-bottom:12px">❓</div>'
      +'<div style="font-family:Syne,sans-serif;font-weight:700;font-size:15px;color:#FFFFFF;margin-bottom:8px">Noch keine Annahmen erfasst</div>'
      +'<div style="font-size:13px;color:#7068A0">Kritische Annahmen dokumentieren und systematisch verfolgen.</div><br>'
      +'<button class="btn btn-gold btn-sm" onclick="openAssumptionModal()">+ Erste Annahme erfassen</button></div>')
    :('<div class="assump-grid">'+S.assumptions.map(buildCard).join('')+'</div>');
  var warn=high.length
    ?('<div style="background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.25);border-radius:10px;padding:12px 16px;margin-bottom:18px;display:flex;align-items:center;gap:12px">'
      +'<div style="font-size:22px">⚠</div><div>'
      +'<div style="font-family:Syne,sans-serif;font-weight:700;color:#F87171;font-size:13px">'+high.length+' Annahme'+(high.length>1?'n':'')+' mit hohem Risiko und schwacher Evidenz</div>'
      +'<div style="font-size:11.5px;color:#7068A0;margin-top:2px">Diese Annahmen müssen prioritär validiert werden.</div></div></div>')
    :'';
  var n=S.assumptions.length, nh=S.assumptions.filter(function(a){return a.riskLevel==='hoch';}).length;
  var nc=S.assumptions.filter(function(a){return a.status==='confirmed';}).length;
  function sc(v,c,l){return '<div style="background:var(--card);border:1px solid '+c+'33;border-radius:8px;padding:8px 14px;text-align:center">'
    +'<div style="font-family:Syne,sans-serif;font-weight:800;font-size:22px;color:'+c+';line-height:1">'+v+'</div>'
    +'<div style="font-size:9.5px;color:#7068A0;font-family:Syne,sans-serif">'+l+'</div></div>';}
  return '<div style="max-width:900px">'
    +'<div class="view-title">❓ Kritische Annahmen</div>'
    +'<div class="view-sub">Was muss wahr sein, damit das Venture funktioniert? Evidenzstärke und Risiko systematisch verfolgen.</div>'
    +warn
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px">'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap">'+sc(n,'rgba(255,255,255,.5)','Gesamt')+sc(nh,'#F87171','Hohes Risiko')+sc(nc,'#34D399','Bestätigt')+'</div>'
    +'<button class="btn btn-gold btn-sm" onclick="openAssumptionModal()">+ Annahme hinzufügen</button></div>'
    +'<div class="view-section">'+cards+'</div></div>';
}

function initMentorMode(){
  const regularApp=document.getElementById('app');
  if(regularApp) regularApp.style.display='none';
  const mentorApp=document.getElementById('mentor-app');
  if(!mentorApp){alert('Mentor-App div fehlt!');return;}
  mentorApp.style.display='block';
  let authed=false;
  try{authed=sessionStorage.getItem('ecl-mentor-auth')==='1';}catch{}
  _showMentor(mentorApp, authed);
}

      challenge:'Kostenstruktur im BMC ohne eine einzige Zahl. Runway von 3–4 Monaten ist sehr knapp. Revenue-based Financing nicht korrekt definiert.',
      nextstep:'Kostenstruktur mit konkreten Zahlen füllen (Tech-Entwicklung, Content-Budget). Runway-Lücke durch EXIST-Förderung oder Investor-Gespräch schließen.',
    },
    'WasteLess': {
      pmf:4, biz:4, evid:2, clarity:4, conv:4, team:4, odoo:5, ops:4, real:2,
      strength:'Methodisch vollständigste Abgabe im Kurs. Detailliertster Odoo-Ablauf (Bestellung bis Nachbestellung). Selbstkritische Benennung der Technologie als Engpassressource.',
      challenge:'Sensor-Machbarkeit bei Zielpreis (<20 EUR Produktionskosten) weiterhin unbeantwortet – diese Frage entscheidet über das gesamte Finanzmodell.',
      nextstep:'Technologierecherche oder Prototyp: Welcher Sensor, welcher Hersteller, welche Kosten bei welcher Genauigkeit? Konkrete Aussage statt Konzept.',
    },
    'DOOOZE': {
      pmf:3, biz:2, evid:3, clarity:4, conv:3, team:4, odoo:3, ops:3, real:2,
      strength:'Professionellster Auftritt im Kurs, stärkstes Branding. Bewusste Positionierung als Lifestyle-Accessoire mit klarer Zielgruppe. Bootstrapping-Wahl konsequent begründet.',
      challenge:'Akustische Kernfrage offen: Wie viel dB Reduktion leistet ein Stoff-Haarband tatsächlich? Ohne diesen Nachweis bleibt die Kernbehauptung unbelegt.',
      nextstep:'Einfacher Vergleichstest: DOOOZE vs. Standard-Ohrstöpsel, dB-Messung per App. Ergebnis entscheidet Positionierung (Schlafhilfe vs. reines Lifestyle-Produkt).',
    },
    'StilMittel': {
      pmf:4, biz:3, evid:5, clarity:3, conv:3, team:3, odoo:2, ops:3, real:3,
      strength:'Gesellschaftlich relevanteste Idee im Kurs. Stigma als eigentliches Kernproblem erkannt – selten gemachte Einsicht. MDR korrekt eingeordnet nach Feedback.',
      challenge:'BMC und Prozessdesign zeigen noch zu viele Platzhalter. Ethik-Analyse mit Einzeilern. Operative Abläufe nicht konkret beschreibbar.',
      nextstep:'BMC mit konkreten Aktivitäten, Ressourcen und Personas hinterlegen. Prozessschritte so beschreiben, dass jemand anderes sie ausführen könnte.',
    },
    'VEIL': {
      pmf:3, biz:2, evid:3, clarity:3, conv:3, team:3, odoo:3, ops:4, real:4,
      strength:'Preise und Produktionskosten erstmals konkret hinterlegt. ModiBodi als technologisch überlegener Wettbewerber ehrlich anerkannt. Fashion-Brand-Instinkt erkennbar.',
      challenge:'Massiver Finanzwiderspruch: 200.000 EUR vs. 20.000 EUR Startkapital im selben Dokument. Muss vor Demo Day aufgelöst werden.',
      nextstep:'Finanzmodell auf eine konsistente Szenario-Basis bringen. Differenzierung zu ModiBodi über Branding hinaus inhaltlich belegen.',
    },
    'EasyWine': {
      pmf:2, biz:1, evid:1, clarity:4, conv:2, team:4, odoo:1, ops:1, real:2,
      strength:'Sauberste Dokumentationsqualität im Kurs. Bestes Peer-Feedback (konkret, kritisch, umsetzbar). Pain Points der Zielgruppe klar beobachtet.',
      challenge:'Vivino (65 Mio. Nutzer, kostenlos) löst exakt dasselbe Problem – Differenzierung bisher nicht überzeugend beantwortet. Kein S4 eingereicht.',
      nextstep:'Konkrete Differenzierungsantwort auf Vivino entwickeln. Was kann EasyWine, was Vivino nicht kann oder nicht will?',
    },
    'WorkFlowWerk': {
      pmf:4, biz:4, evid:2, clarity:4, conv:4, team:3, odoo:3, ops:2, real:3,
      strength:'Stärkste B2B-Analyse im Kurs. Konkrete Preispakete (S/M/L) mit Margenangaben. EXIST-Förderung als Runway-Brücke realistisch geplant. Anthropic als Bedrohung ehrlich erkannt.',
      challenge:'Cold-Start-Problem (Hühnerei: Freelancer vs. Unternehmen) weiterhin vollständig unbeantwortet – war bereits in S2 offen. Autonomie-Ethik nicht durchdacht.',
      nextstep:'Konkrete Antwort auf Cold-Start entwickeln: Wer wird zuerst gewonnen, wie, mit welchem Anreiz? Diese Frage entscheidet über Marktstart.',
    },
  };

  // Pre-populate only if no ratings exist yet for a team
  Object.keys(BASELINE_RATINGS).forEach(function(team){
    if(!_ratings[team] || Object.keys(_ratings[team]).filter(function(k){return !isNaN(_ratings[team][k]);}).length === 0){
      _ratings[team] = Object.assign({}, BASELINE_RATINGS[team]);
    }
  });
  saveRatings();


  function saveRatings(){ try{sessionStorage.setItem('ecl-mentor-ratings',JSON.stringify(_ratings));}catch{} }
  function getRatings(team){ return _ratings[team] || {}; }

  function calcScore(team){
    const r = getRatings(team);
    let total = 0;
    CRITERIA.forEach(sec => {
      const secMax = sec.items.length * 5;
      const secGot = sec.items.reduce((a,it) => a + (parseInt(r[it.id])||0), 0);
      total += (secGot / secMax) * sec.pct;
    });
    return Math.round(total * 45 / 100 * 10) / 10; // scale to 45 pt
  }

  function buildRatingForm(team){
    const r = getRatings(team);
    const totalScore = calcScore(team);
    const level = SCORE_LEVELS.find(l=>totalScore>=l.min) || SCORE_LEVELS[SCORE_LEVELS.length-1];
    const allFilled = CRITERIA.every(sec=>sec.items.every(it=>parseInt(r[it.id])>0));

    const secHtml = CRITERIA.map(sec=>{
      const secScore = sec.items.reduce((a,it)=>a+(parseInt(r[it.id])||0),0);
      const secMax = sec.items.length * 5;
      return '<div style="margin-bottom:18px">'
        +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'
        +'<div style="font-family:Syne,sans-serif;font-weight:800;font-size:13px;color:#FFFFFF">'+sec.section+'</div>'
        +'<div style="font-size:10px;font-family:Syne,sans-serif;font-weight:700;color:#8878B8">Gewichtung '+sec.pct+'% &nbsp;·&nbsp; '+secScore+'/'+secMax+' Pkt.</div>'
        +'</div>'
        +sec.items.map(it=>{
          const val = parseInt(r[it.id])||0;
          const stars = [1,2,3,4,5].map(n=>{
            const active = n<=val;
            return '<button onclick="_mRate(\''+team+'\',\''+it.id+'\','+n+')" style="width:30px;height:30px;border-radius:6px;border:1.5px solid '+(active?'rgba(200,124,56,.7)':'rgba(25,20,50,.12)')+';background:'+(active?'rgba(200,124,56,.18)':'none')+';color:'+(active?'#C87C38':'#4A3A5A')+';font-family:Syne,sans-serif;font-weight:800;font-size:13px;cursor:pointer;transition:all .15s">'+n+'</button>';
          }).join('');
          return '<div style="background:rgba(255,255,255,.04);border-radius:9px;padding:12px 14px;margin-bottom:7px">'
            +'<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">'
            +'<div><div style="font-family:Syne,sans-serif;font-weight:700;font-size:12.5px;color:#FFFFFF;margin-bottom:3px">'+it.label+'</div>'
            +'<div style="font-size:11px;color:#6A6080;line-height:1.45">'+it.q+'</div></div>'
            +'<div style="display:flex;gap:4px;flex-shrink:0">'+stars+'</div>'
            +'</div></div>';
        }).join('')
        +'</div>';
    }).join('');

    const commentFields = [
      {key:'strength',label:'Größte Stärke des Ventures'},
      {key:'challenge',label:'Größte offene Herausforderung'},
      {key:'nextstep',label:'Nächster sinnvoller Entwicklungsschritt'},
    ].map(cf=>'<div style="margin-bottom:12px">'
      +'<div style="font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#8878B8;font-family:Syne,sans-serif;font-weight:700;margin-bottom:6px">'+cf.label+'</div>'
      +'<textarea oninput="_mComment(\''+team+'\',\''+cf.key+'\',this.value)" rows="3" style="width:100%;background:rgba(25,20,50,.05);border:1px solid rgba(25,20,50,.12);border-radius:8px;color:#FFFFFF;font-family:DM Sans,sans-serif;font-size:13px;padding:9px 12px;outline:none;resize:vertical">'+((r[cf.key]||'').replace(/</g,'&lt;'))+'</textarea>'
      +'</div>'
    ).join('');

    return '<div style="background:var(--card);border:1px solid rgba(25,20,50,.1);border-radius:14px;overflow:hidden">'
      // Score bar
      +'<div style="background:'+level.col+'18;border-bottom:1px solid '+level.col+'33;padding:16px 22px;display:flex;align-items:center;gap:16px">'
      +'<div style="font-family:Syne,sans-serif;font-weight:800;font-size:36px;color:'+level.col+';line-height:1">'+totalScore+'<span style="font-size:16px;color:'+level.col+'88">/45</span></div>'
      +'<div><div style="font-family:Syne,sans-serif;font-weight:800;font-size:15px;color:'+level.col+'">'+level.label+'</div>'
      +(level.desc?'<div style="font-size:12px;color:#8878B8;margin-top:2px">'+level.desc+'</div>':'')
      +(allFilled?'':'<div style="font-size:11px;color:#6A6080;margin-top:2px">Noch nicht alle Kriterien bewertet</div>')+'</div>'
      +'<div style="margin-left:auto"><button onclick="_mExport(\''+team+'\')" style="background:rgba(25,20,50,.1);border:1px solid rgba(25,20,50,.18);color:#A098C0;padding:6px 14px;border-radius:6px;cursor:pointer;font-family:Syne,sans-serif;font-weight:700;font-size:10.5px">⬇ Exportieren</button></div>'
      +'</div>'
      // Criteria
      +'<div style="padding:20px 22px">'+secHtml+'</div>'
      // Comments
      +'<div style="padding:0 22px 22px">'
      +'<div style="font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#8878B8;font-family:Syne,sans-serif;font-weight:700;margin-bottom:14px;padding-top:4px;border-top:1px solid rgba(25,20,50,.08)">Kommentare</div>'
      +commentFields+'</div>'
      // Jury note
      +'<div style="margin:0 22px 22px;background:rgba(200,124,56,.06);border:1px solid rgba(200,124,56,.15);border-radius:8px;padding:11px 14px;font-size:11.5px;color:#7A6840;line-height:1.55">'
      +'<strong style="color:#C87C38;font-family:Syne,sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase">Hinweis</strong><br>'
      +'Bewertet nicht die „beste Idee", sondern das Team, das am überzeugendsten gezeigt hat, dass es ein reales Problem verstanden, daraus ein konsistentes Venture entwickelt und dieses strategisch wie operativ durchdacht hat.'
      +'</div></div>';
  }

  function buildScoreTable(){
    return '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px">'
      +VENTURES.map(v=>{
        const sc = calcScore(v.team);
        const lv = SCORE_LEVELS.find(l=>sc>=l.min)||SCORE_LEVELS[SCORE_LEVELS.length-1];
        const r = getRatings(v.team);
        const filled = CRITERIA.reduce((a,s)=>a+s.items.filter(it=>parseInt(r[it.id])>0).length,0);
        const total = CRITERIA.reduce((a,s)=>a+s.items.length,0);
        return '<div style="background:var(--card);border:1px solid rgba(25,20,50,.08);border-radius:10px;padding:12px 14px;cursor:pointer" onclick="document.getElementById(\'mr-'+v.team.replace(/\W/g,'')+'\')?document.getElementById(\'mr-'+v.team.replace(/\W/g,'')+'\').scrollIntoView({behavior:\'smooth\'}):null">'
          +'<div style="font-family:Syne,sans-serif;font-weight:800;font-size:13px;color:#FFFFFF;margin-bottom:4px">'+v.name+'</div>'
          +'<div style="font-family:Syne,sans-serif;font-weight:800;font-size:22px;color:'+lv.col+';line-height:1">'+sc+'<span style="font-size:11px;color:'+lv.col+'55">/45</span></div>'
          +'<div style="font-size:10px;color:#6A6080;margin-top:3px">'+filled+'/'+total+' Kriterien bewertet</div>'
          +'</div>';
      }).join('')
      +'</div>';
  }

  html += '<div style="margin-top:36px;border-top:1px solid rgba(25,20,50,.08);padding-top:28px">'
    +'<div style="font-family:Syne,sans-serif;font-weight:800;font-size:20px;color:#FFFFFF;margin-bottom:6px">📊 Bewertungsbogen Demo Day</div>'
    +'<div style="font-size:12.5px;color:#8878B8;margin-bottom:20px">1–5 Punkte pro Kriterium · max. 45 Punkte gesamt (3 gewichtete Bereiche)</div>'
    + buildScoreTable()
    +'<div style="margin-top:24px;display:flex;flex-direction:column;gap:18px">'
    +VENTURES.map(v=>'<div id="mr-'+v.team.replace(/\W/g,'')+'">'
      +'<div style="font-family:Syne,sans-serif;font-weight:700;font-size:12px;color:#8878B8;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px">'+v.name+' &nbsp;·&nbsp; '+v.team+'</div>'
      +buildRatingForm(v.team)
      +'</div>'
    ).join('')
    +'</div></div>';

  area.innerHTML = html;

  // attach global helpers
  window._mRate = function(team, crit, val){
    if(!_ratings[team]) _ratings[team]={};
    _ratings[team][crit] = _ratings[team][crit]===val ? 0 : val;
    saveRatings(); _showMentor(mentorApp, true);
  };
  window._mComment = function(team, key, val){
    if(!_ratings[team]) _ratings[team]={};
    _ratings[team][key] = val; saveRatings();
  };
  window._mExport = function(team){
    const r = getRatings(team);
    const sc = calcScore(team);
    const lv = SCORE_LEVELS.find(l=>sc>=l.min)||SCORE_LEVELS[SCORE_LEVELS.length-1];
    const data = {team, score:sc, level:lv.label, ratings:r,
      exportedAt:new Date().toISOString(), reviewer:'Mentor:in'};
    const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download='Bewertung_'+team+'_DemoDay.json';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(u),3000);
  };
}

function exitMentorMode(){window.location.href=window.location.pathname;}
window.exitMentorMode=exitMentorMode;

(function init(){
  if(window.location.search.includes('mentor')){initMentorMode();return;}
  load();
  renderSidebar();
  handleHash();
  window.addEventListener('hashchange',handleHash);
  // Close modal on overlay click
  document.getElementById('import-modal').addEventListener('click',e=>{if(e.target===document.getElementById('import-modal'))closeImportModal();});
})();
</script>
</body>
</html>
